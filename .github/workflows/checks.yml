name: Checks

# Lightweight, fast-feedback gate that runs on every PR and push without the
# heavy Tauri build/release matrix in build.yml. Covers the gaps that let
# formatting drift and dependency advisories slip in unnoticed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly RustSec advisory scan (Mon 06:00 UTC) so a freshly published
    # advisory surfaces even without a code change landing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, audit & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust (with rustfmt)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: './src-tauri -> target'
          # PRs restore; only main saves (Actions cache quota is 10 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Rust formatting (cargo fmt --check)
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

      # Exercise actual Tauri target selection with tiny existing binaries,
      # including stale test-helper artifacts, without compiling the app.
      - name: Release binary selection excludes test helpers
        run: python3 -m unittest discover -s .github/scripts -p test_release_binary_gate.py -v

      - name: Linux packaging helpers reject unverified downloads and caches
        run: node --test .github/scripts/test-linuxdeploy-pins.cjs

      # The release-side readers of tool output, with stub tools: each one
      # refuses an output it cannot read instead of passing it as clean.
      - name: AppImage .zsync pairing reads the published asset list
        run: python3 -m unittest discover -s .github/scripts -p test_pair_appimage_zsync.py -v

      - name: Snap stale-package audit reads every staged package
        run: node --test .github/scripts/test-snap-stale-packages.mjs

      # Two checks that read a git command through a command substitution,
      # which hides its exit status: each now fails when git does.
      - name: DCO check fails when git cannot read the commit range
        run: python3 -m unittest discover -s .github/scripts -p test_dco_check.py -v

      - name: Emitter guard fails when git status fails
        run: python3 -m unittest discover -s .github/scripts -p test_aerorsync_emit_guard.py -v

      # The snap gate's two passes, with stub snapcraft and unsquashfs: a gpu:
      # finding fails it, and a linter that never ran is UNVERIFIED, never OK.
      # The snap and AppImage gates below read text from tools this repo does
      # not pin, and each one fails on output it cannot read instead of
      # passing it. The snap gates run only on tags and dispatches, so this is
      # where a pull request exercises them.
      - name: Snap GPU gate reads the snapcraft lint report
        run: python3 -m unittest discover -s .github/scripts -p test_snap_gpu_lint_check.py -v

      - name: Snap ABI gate reads every ELF and every objdump answer
        run: python3 -m unittest discover -s .github/scripts -p test_snap_abi_check.py -v

      - name: Snap GUI gate requires the app's own EGL and app_ready lines
        run: python3 -m unittest discover -s .github/scripts -p test_snap_gui_check.py -v

      - name: AppImage permission check reads every line of the listing
        run: python3 -m unittest discover -s .github/scripts -p test_appimage_permissions_check.py -v

      - name: Frontend unit tests (vitest)
        run: npm run test:unit

      - name: Shared connection manifest and one-surface mutation guard
        run: node .github/scripts/check-connection-manifest.mjs --self-test

      # Stripped diacritics are invisible to i18n:validate: the value is
      # present, is not a placeholder and is the right length, it is simply
      # spelled wrong. The class grew for eight months across eight commits
      # because nothing looked. Runs here rather than in the long build lane so
      # a locale typo costs minutes instead of the better part of two hours.
      # It compares against a reviewed baseline and only fails on a NEW hit;
      # judge it, then either fix the string or record why it is correct in
      # scripts/i18n-diacritics-accepted.json. Never bulk-accept.
      - name: i18n stripped-diacritics gate
        run: npm run i18n:diacritics

      # Raw English in a locale is invisible to i18n:validate too: the key is
      # present, the value is a non-empty string and it is not a placeholder,
      # it is simply still English. The naive test fires on 16000 pairs, almost
      # all of them correct (FTP, AeroCloud, us-east-1), so this gate takes its
      # evidence from the shape of the ENGLISH source and reports only
      # translatable prose. It ran as a RATCHET rather than --strict only while
      # a backlog existed: `--max=<n>` with n the backlog of the day, lowered by
      # every batch of translations in the same commit that did the translating
      # and never raised. n reached 0, so `npm run i18n:untranslated` now passes
      # `--strict` (see package.json) and ANY untranslated pair fails, together
      # with a drifted deliberate key or a new reference leak, neither of which
      # was ever subject to the ratchet. A string genuinely correct as English
      # in that language is recorded, one reviewed sentence at a time, in
      # scripts/i18n-untranslated-accepted.json. Never bulk-accept.
      - name: i18n raw-English gate
        run: npm run i18n:untranslated

      # Letters from the wrong writing system are invisible to every gate above:
      # the value is present, translated and correctly accented, it is simply
      # built partly from another alphabet. Georgian and Japanese inside Khmer,
      # kanji inside Bulgarian, a Latin i inside a Ukrainian word that looks
      # identical and breaks search. Each locale declares its scripts in the
      # detector; any character outside them, any word mixing Latin with the
      # native letters, and any stray invisible character fails. A string
      # genuinely correct as written is recorded, with the reason, in
      # scripts/i18n-contamination-accepted.json. Never bulk-accept.
      - name: i18n foreign-script gate
        run: npm run i18n:contamination

      # The corpus exercises only the cases it happens to contain; the fixtures
      # pin the rest (an emoji ZWJ sequence, a bidi control, a stale acceptance).
      - name: i18n foreign-script gate self-test
        run: node --test .github/scripts/test-i18n-contamination.mjs

      # A locale can keep the previous English after en.json moves on. The
      # value is present, it is not the current English, and it has no function
      # word the untranslated gate would notice, so it passes every check above.
      # masterPassword.tooShort stayed "Minimum 8 characters" in 39 locales.
      # The ledger of former English strings is committed because this job
      # checks out with fetch-depth 1: a git walk of en.json would see only the
      # tip commit. Changing English without rebuilding the ledger changes its
      # hash and fails the gate. A string that is correct even though it equals
      # an older English is recorded, with the reason, in
      # scripts/i18n-stale-english-accepted.json. Never bulk-accept.
      - name: i18n former-English gate
        run: npm run i18n:stale-english

      # Fixtures pin a former-English hit, a real translation, a reviewed
      # acceptance, a stale acceptance, and a ledger hash that does not match.
      - name: i18n former-English gate self-test
        run: node --test .github/scripts/test-i18n-stale-english.mjs

      # Every published "how many providers / presets / protocols" figure is
      # derived from the catalog and the registry into docs/PROVIDER-INVENTORY.json.
      # They used to be prose, which is why three different numbers for the same
      # noun could all sit in the tree at once and none of them error. This fails
      # when the committed inventory no longer matches the code, and prints which
      # count moved, so the prose that quotes it gets updated in the same commit.
      - name: Provider inventory is not stale
        run: npm run check:provider-inventory

      # Eight files declare the application version. The list used to exist twice,
      # here in the local pre-push gate with all eight and in build.yml's R10 step
      # with four, and the four-file one was the only one that ran by itself. That
      # is how v4.1.9 was tagged with package-lock.json a version behind in both of
      # its fields: main was green with the drift on it, and 148 of 166 tags carry
      # the same drift. The list now lives in the script and this step is the cheap
      # caller that runs on every pull request, before any build exists.
      - name: Version sites agree
        run: npm run check:version-sites

      # The metainfo and the desktop entry are what Ubuntu App Center and GNOME
      # Software read, the release procedure adds a <release> block to the
      # metainfo on every version, and until now nothing validated either one.
      #
      # The two tools are installed rather than assumed present: whether the
      # runner image already carries them was not measured, and installing a
      # package that is already there is cheap while assuming one that is not
      # would fail the job. --no-install-recommends matches every other apt
      # step in this repository. If this turns out to cost real time, the fix
      # is to cache it, not to drop the gate: the script exits 1 when a tool
      # is missing, on purpose, because a gate that cannot run is not a pass.
      - name: Install AppStream and desktop validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils

      - name: AppStream metadata validates
        run: npm run check:appstream

      # The gate reads appstreamcli's report, and the report's shape depends on
      # the version this runner image happens to carry: block YAML from 1.0.2,
      # a JSON-shaped document from 1.1.2 that is not strict JSON. Reports
      # captured from both binaries pin that they give the same findings and
      # the same verdict, and that a report the gate cannot read still fails.
      - name: AppStream gate self-test
        run: node --test .github/scripts/test-check-appstream.mjs

      # `cargo install cargo-audit --locked` compiled the tool from source on
      # every run: measured at 2m58s, for an audit that then takes about five
      # seconds, on the workflow that runs more often than any other here (42
      # times on main in the last seven days).
      #
      # The Rust cache above does cache `~/.cargo/bin`, so the intuitive reading
      # is that it should already have covered this. It does not, because of how
      # that action saves: on an exact key hit it reports the cache up to date
      # and skips the save entirely, so a binary installed later in the same job
      # is never persisted. cargo-audit could only ever enter that cache on the
      # rarer runs where the dependency key had already changed, which is why it
      # was rebuilt again and again.
      #
      # Give the tool its own cache, keyed by month, so its update cycle is
      # separate from the app's dependency cycle and neither can skip the other.
      # Monthly rather than pinned so the tool still moves forward without being
      # rebuilt forty times to get there, and it does not go stale in the
      # meantime: `cargo audit` fetches the advisory database at run time rather
      # than baking it into the binary. Uses the official cache action already
      # pinned by SHA elsewhere in this repo rather than a binary-installer
      # action, to add no supply-chain surface to a security step.
      - name: Month stamp for the cargo-audit cache key
        id: audit-key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Restore and save are split deliberately. The combined `actions/cache`
      # saves from a post-job step declared `post-if: success()`, so a job that
      # ends red never saves. On main the audit below is authoritative, so a
      # real advisory would fail the job and throw away the binary that had just
      # been built: every rerun while the advisory is being fixed would pay the
      # install again, precisely when runs are most frequent. Saving here, right
      # after a successful install and before anything that can fail, makes the
      # binary outlive a failing audit.
      - name: Restore the cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.audit-key.outputs.month }}

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Save the cargo-audit binary
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ steps.cargo-audit-cache.outputs.cache-primary-key }}

      - name: Rust dependency audit (cargo audit)
        working-directory: ./src-tauri
        # Non-blocking on PRs: a newly published advisory on a transitive
        # dependency must not red-wall an unrelated PR. On push to main and on
        # the weekly schedule the step is authoritative and fails the job.
        # `--deny warnings`: without it a yanked crate, and a registry timeout
        # that leaves the yank check unrun, both end as a printed warning with
        # exit 0, indistinguishable from a pass (#661 declared that gap; the
        # v4.1.9 audit measured it still open). The dependency tree is
        # warning-clean today, so an unavailable check now fails red here
        # instead of being read as clean.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo audit --deny warnings
