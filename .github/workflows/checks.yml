name: Checks

# Lightweight, fast-feedback gate that runs on every PR and push without the
# heavy Tauri build/release matrix in build.yml. Covers the gaps that let
# formatting drift and dependency advisories slip in unnoticed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly RustSec advisory scan (Mon 06:00 UTC) so a freshly published
    # advisory surfaces even without a code change landing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, audit & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust (with rustfmt)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Rust formatting (cargo fmt --check)
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

      - name: Frontend unit tests (vitest)
        run: npm run test:unit

      # Stripped diacritics are invisible to i18n:validate: the value is
      # present, is not a placeholder and is the right length, it is simply
      # spelled wrong. The class grew for eight months across eight commits
      # because nothing looked. Runs here rather than in the long build lane so
      # a locale typo costs minutes instead of the better part of two hours.
      # It compares against a reviewed baseline and only fails on a NEW hit;
      # judge it, then either fix the string or record why it is correct in
      # scripts/i18n-diacritics-accepted.json. Never bulk-accept.
      - name: i18n stripped-diacritics gate
        run: npm run i18n:diacritics

      # Raw English in a locale is invisible to i18n:validate too: the key is
      # present, the value is a non-empty string and it is not a placeholder,
      # it is simply still English. The naive test fires on 16000 pairs, almost
      # all of them correct (FTP, AeroCloud, us-east-1), so this gate takes its
      # evidence from the shape of the ENGLISH source and reports only
      # translatable prose. It runs as a RATCHET rather than --strict: the
      # backlog of the day is the ceiling, a newly untranslated string breaks
      # it, and every batch of translations lowers the number in the same
      # commit that does the translating. The number is never raised.
      - name: i18n raw-English gate
        run: npm run i18n:untranslated

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust dependency audit (cargo audit)
        working-directory: ./src-tauri
        # Non-blocking on PRs: a newly published advisory on a transitive
        # dependency must not red-wall an unrelated PR. On push to main and on
        # the weekly schedule the step is authoritative and fails the job.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo audit
