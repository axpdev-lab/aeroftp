# The listing tests that need a server speaking MLSD and MLST.
#
# They exist as a workflow rather than as instructions in a README because the
# tests are `#[ignore]`, and an ignored test that no job runs is a defence that
# is present and never fires. The branch they cover is the one most FTP servers
# take, and a defect lived on it unnoticed precisely because nothing exercised
# it. Running them by hand would leave that true.
#
# The docker fixture follows the shape delta-sync-integration.yml already uses.

name: FTP MLSD listing

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/providers/ftp.rs'
      - 'src-tauri/src/providers/ftp_listing.rs'
      - 'src-tauri/src/providers/types.rs'
      - 'src-tauri/tests/integration_ftp_mlsd.rs'
      - 'src-tauri/tests/fixtures/ftp-mlsd/**'
      - 'src-tauri/tests/fixtures/ftp/**'
      - '.github/workflows/ftp-mlsd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/providers/ftp.rs'
      - 'src-tauri/src/providers/ftp_listing.rs'
      - 'src-tauri/src/providers/types.rs'
      - 'src-tauri/tests/integration_ftp_mlsd.rs'
      - 'src-tauri/tests/fixtures/ftp-mlsd/**'
      - 'src-tauri/tests/fixtures/ftp/**'
      - '.github/workflows/ftp-mlsd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mlsd:
    runs-on: ubuntu-latest
    # Without a job cap, a slow apt mirror plus a cold Tauri build can sit until
    # the platform limit. delta-sync-integration.yml caps at 110 for the same
    # shape of work.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The three packages are the right ones and were not the whole answer.
      # delta-sync-integration.yml caches these archives because that download
      # IS the observed failure mode of these lanes, with the measurements in
      # its own comment: 61.5 MB of .deb, an Azure mirror serving one runner at
      # roughly 45 kB/s, `libwebkit2gtk-4.1-0` alone taking 12m02s, and the step
      # still fetching at 23m02s when the job cap killed it. `apt-get update` is
      # not the cost. Installing the same list without the cache inherits that
      # failure whole, so the cache travels with the list.
      - name: apt archive cache key
        id: apt-archive-key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/apt-archives
          key: apt-ftp-mlsd-${{ runner.os }}-${{ steps.apt-archive-key.outputs.week }}
          restore-keys: |
            apt-ftp-mlsd-${{ runner.os }}-

      # The test target links the Tauri crate, so the GTK/WebKit stack has to be
      # present or the glib-sys build script fails before a single test runs.
      # Bounded and retried for the same reason as the sibling lane: a slow
      # mirror should fail THIS step, with its name in the log, rather than
      # cancel the job and leave every test reported as skipped.
      - name: Install system dependencies
        timeout-minutes: 12
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            # An attempt killed mid-unpack leaves dpkg half-configured, and the
            # next apt-get would refuse to run until it is told to finish.
            sudo dpkg --configure -a || true
            mkdir -p "$HOME/apt-archives/partial"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives="$HOME/apt-archives/" \
              -o APT::Keep-Downloaded-Packages=true \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev
            # apt ran as root; hand the archives back so the cache save (which
            # runs as the runner user) can read them.
            sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      # It pulls a base image from Docker Hub, which this repo has seen time
      # out before (see aerorsync-protocol.yml).
      - name: Build and start the MLSD fixture
        timeout-minutes: 10
        working-directory: src-tauri/tests/fixtures/ftp-mlsd
        run: docker compose up -d --build

      # A control connection that answers is the only readiness signal that
      # means anything here: the container being up says the process started,
      # not that it is serving.
      # `/dev/tcp` is a bash builtin, so this needs no package. The sibling
      # lane that waits for a service installs `netcat-openbsd` first, which
      # says plainly that `nc` cannot be assumed on this runner; removing the
      # dependency is better than adding the install.
      # Three minutes, not two, and the arithmetic is the reason. The loop runs
      # 30 iterations, and its worst case is one where the port is OPEN and
      # silent: `read -t 3` waits its full three seconds and the `sleep 1`
      # follows, so 30 x 4s is 120s, which is exactly what two minutes allows.
      # The cap and the loop would finish together, and if the cap won the step
      # would die MUTE, without the line written to say what happened. That
      # worst case is not hypothetical: it is precisely the state the stalling
      # fixture creates.
      - name: Wait for the fixture to answer
        timeout-minutes: 3
        run: |
          for i in $(seq 1 30); do
            if exec 3<>/dev/tcp/127.0.0.1/2199 2>/dev/null \
               && read -r -t 3 -u 3 banner \
               && [[ "$banner" == 220* ]]; then
              echo "fixture answering after ${i}s: $banner"
              exec 3<&- 3>&-
              exit 0
            fi
            exec 3<&- 3>&- 2>/dev/null || true
            sleep 1
          done
          echo "the fixture never answered on 2199"
          exit 1

      # 15 minutes is a warm-cache figure. The first run on a branch compiles
      # the Tauri crate from nothing, and a cap that bites once and never again
      # reads as an infrastructure problem rather than as a wrong number.
      - name: Listing tests against an MLSD server
        timeout-minutes: 40
        working-directory: src-tauri
        run: cargo test --test integration_ftp_mlsd -- --ignored --nocapture

      - name: Dump fixture logs on failure
        if: failure()
        working-directory: src-tauri/tests/fixtures/ftp-mlsd
        run: |
          docker logs aeroftp-ftp-mlsd-fixture || true
          docker compose ps

      - name: Teardown
        if: always()
        working-directory: src-tauri/tests/fixtures/ftp-mlsd
        run: docker compose down -v

  # A listing that times out must not hand the session on. This runs the guard
  # for that as its own job rather than inside `mlsd`, because it needs a
  # different server: `slowftp.py --feat mlsd-hang` accepts MLSD and then says
  # nothing, which the docker fixture above cannot do.
  listing-timeout:
    runs-on: ubuntu-latest
    # The test itself waits out LIST_BUDGET, which is 300s and not injectable,
    # and a cold Tauri build precedes it. 90 is the same cap the job above uses
    # for the same shape of work, and it is not tight: the wait is five minutes
    # of the ninety.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The three steps below are copied from the `mlsd` job, deliberately and
      # in full. This job was added beside that one and inherits nothing from
      # it: without them `cargo` reaches `glib-sys`, cannot find `glib-2.0`, and
      # fails with exit 101 before a single test runs, which is what happened on
      # the first attempt. The fixture had started correctly; the build never
      # got to it.
      #
      # Copying only the install would have been worse than copying nothing,
      # because the failure would have moved instead of going away: that mirror
      # serves about 45 kB/s, `libwebkit2gtk-4.1-0` alone took 12m02s once and
      # was still fetching at 23m02s when a job cap killed it. The lane would
      # have become slow and intermittent rather than red, which is harder to
      # diagnose than a clean failure.
      #
      # The cache KEY is the sibling's, not a new one. The package list is
      # identical, so a separate key would pay the same 61.5 MB twice and the
      # two jobs would never help each other; sharing it means whichever runs
      # first fills it for the other.
      - name: apt archive cache key
        id: apt-archive-key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/apt-archives
          key: apt-ftp-mlsd-${{ runner.os }}-${{ steps.apt-archive-key.outputs.week }}
          restore-keys: |
            apt-ftp-mlsd-${{ runner.os }}-

      - name: Install system dependencies
        timeout-minutes: 12
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            sudo dpkg --configure -a || true
            mkdir -p "$HOME/apt-archives/partial"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives="$HOME/apt-archives/" \
              -o APT::Keep-Downloaded-Packages=true \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev

      # 420s of hanging, not 90: the fixture must outlast the 300s budget under
      # test. At the old default of 90 the fixture gave up first, and a test that
      # believed it was measuring the cap measured the fixture and passed.
      - name: Start the hanging-MLSD fixture
        working-directory: src-tauri/tests/fixtures/ftp
        run: |
          python3 slowftp.py --port 2140 --feat mlsd-hang --hang 420 \
            > /tmp/slowftp-mlsd-hang.log 2>&1 &
          echo $! > /tmp/slowftp.pid

      # The banner, not the process: a pid says the interpreter started, not that
      # it is serving. 20 iterations worst case is 20 x (3s read + 1s sleep) =
      # 80s, comfortably inside the two-minute cap, so the loop finishes before
      # the cap and the step cannot die mute.
      - name: Wait for the fixture to answer
        timeout-minutes: 2
        run: |
          for i in $(seq 1 20); do
            if exec 3<>/dev/tcp/127.0.0.1/2140 2>/dev/null \
               && read -r -t 3 -u 3 banner \
               && [[ "$banner" == 220* ]]; then
              echo "fixture answering after ${i}s: $banner"
              exec 3<&- 3>&-
              exit 0
            fi
            exec 3<&- 3>&- 2>/dev/null || true
            sleep 1
          done
          echo "the fixture never answered on 2140"
          exit 1

      # The count is checked because this selects by NAME with `--lib`, the shape
      # that prints "test result: ok" and exits 0 when the filter matches
      # nothing. Exactly one, not "at least one": this step promises to run one
      # named test, so a second arriving here is a change to what the job does
      # and should be said out loud. The sibling aerorsync lane uses `-lt`
      # instead, and correctly: it collects a whole module, which may grow.
      - name: The session must not survive a timed-out listing
        timeout-minutes: 40
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --lib providers::ftp::live_listing_timeout -- \
            --ignored --nocapture | tee /tmp/listing-timeout.log
          ran=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/listing-timeout.log \
                | grep -oE '[0-9]+' | head -1 || true)
          echo "live listing-timeout tests executed: ${ran:-none}"
          if [ "${ran:-0}" -ne 1 ]; then
            echo "::error::expected exactly 1 test, ran ${ran:-0}: the filter stopped matching,"
            echo "::error::which is a green that executed nothing. Fix the filter, not this check."
            exit 1
          fi

      - name: Fixture log on failure
        if: failure()
        run: cat /tmp/slowftp-mlsd-hang.log || true

      - name: Teardown
        if: always()
        run: kill "$(cat /tmp/slowftp.pid)" 2>/dev/null || true
