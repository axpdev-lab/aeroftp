name: Proton Native

# Dedicated workflow for the native Proton Drive client
# (`src-tauri/src/providers/proton_native/`, feature `proton-native`, off by
# default and never shipped). build.yml compiles default features only, so
# without this file the module and its vendored `proton-rpgp` would never be
# built in CI. It runs on its own runner to stay off linux-validate, which is
# already close to its 90-minute limit.
#
# Triggering policy: path-filtered to the module and to what it reads from
# the rest of the crate (the providers module for AEROFTP_USER_AGENT,
# retry_after.rs, build.rs for the dependency categories), the vendored crate,
# the manifests and this file. A weekly run and workflow_dispatch catch drift
# from code outside the filter, the blind spot of every path-gated job: a red
# here is attributed only after checking which commits really triggered it.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/providers/proton_native/**'
      - 'src-tauri/src/providers/mod.rs'
      - 'src-tauri/src/providers/retry_after.rs'
      - 'src-tauri/vendor/proton-rpgp/**'
      - 'src-tauri/build.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/proton-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/providers/proton_native/**'
      - 'src-tauri/src/providers/mod.rs'
      - 'src-tauri/src/providers/retry_after.rs'
      - 'src-tauri/vendor/proton-rpgp/**'
      - 'src-tauri/build.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/proton-native.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proton-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: clippy + unit suite (proton-native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          # PRs restore; only main saves (Actions cache quota is 10 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux system deps
        run: |
          # Runner-image extras: the preinstalled microsoft*, azure-cli* and google-chrome*
          # apt repos fail often enough to redden a run (403 on InRelease, Hash Sum
          # mismatch on Packages.gz), and nothing here installs from any of them.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure-cli* /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libzstd-dev libacl1 libacl1-dev
      - name: cargo clippy (lib + tests, -D warnings)
        working-directory: src-tauri
        run: cargo clippy --lib --tests --features proton-native -- -D warnings
      # `proton_native` is a substring filter: a rename would make this step
      # compile the crate, run nothing and exit 0. 26 is what it runs today
      # (the live sign-in test is #[ignore] and needs a person at a browser);
      # a floor, because the module is meant to grow.
      - name: Unit suite
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --lib --features proton-native proton_native | tee /tmp/proton-native-unit.log
          ../scripts/assert-tests-ran.sh /tmp/proton-native-unit.log 26 \
            "proton_native unit suite"
