name: Proton Native

# Dedicated workflow for the native Proton Drive client
# (`src-tauri/src/providers/proton_native/`, feature `proton-native`, enabled
# in default release builds). This focused workflow supplements build.yml with
# the native unit suite and its assertion floor on an independent runner.
#
# Triggering policy: path-filtered to the module and to what it reads from
# the rest of the crate (the providers module for AEROFTP_USER_AGENT,
# retry_after.rs, build.rs for the dependency categories), the vendored crate,
# the manifests and this file. A weekly run and workflow_dispatch catch drift
# from code outside the filter, the blind spot of every path-gated job: a red
# here is attributed only after checking which commits really triggered it.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/providers/proton_native/**'
      - 'src-tauri/src/providers/mod.rs'
      - 'src-tauri/src/providers/retry_after.rs'
      - 'src-tauri/vendor/proton-rpgp/**'
      - 'src-tauri/build.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/proton-native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/providers/proton_native/**'
      - 'src-tauri/src/providers/mod.rs'
      - 'src-tauri/src/providers/retry_after.rs'
      - 'src-tauri/vendor/proton-rpgp/**'
      - 'src-tauri/build.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/proton-native.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proton-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: clippy + unit suite (proton-native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        # Blank only for rust-cache: RUST_BACKTRACE changes no artefact but would
        # put this job's key outside the `linux-dev` family (see
        # delta-sync-integration.yml). CARGO_TERM_COLOR stays: every job already
        # has it as `always` from dtolnay/rust-toolchain, and cargo refuses an
        # empty value, which fails rust-cache's `cargo metadata` and drops
        # Cargo.toml from the key (seen on #1336: 3de865b5-545dcdc9 against
        # 906c399b-837f71fc).
        env:
          RUST_BACKTRACE: ''
        with:
          workspaces: './src-tauri -> target'
          # Restore-only member of `linux-dev` (see delta-sync-integration.yml).
          shared-key: linux-dev
          save-if: false
      - name: Install Linux system deps
        run: |
          # Runner-image extras: the preinstalled microsoft*, azure-cli* and google-chrome*
          # apt repos fail often enough to redden a run (403 on InRelease, Hash Sum
          # mismatch on Packages.gz), and nothing here installs from any of them.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure-cli* /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libzstd-dev libacl1 libacl1-dev
      - name: cargo clippy (lib + tests, -D warnings)
        working-directory: src-tauri
        run: cargo clippy --lib --tests --features proton-native -- -D warnings
      # `proton_native` is a substring filter: a rename would make this step
      # compile the crate, run nothing and exit 0. 40 is what it runs today
      # (the two live tests are #[ignore] and need a person at a browser);
      # a floor, because the module is meant to grow.
      - name: Unit suite
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --lib --features proton-native proton_native | tee /tmp/proton-native-unit.log
          ../scripts/assert-tests-ran.sh /tmp/proton-native-unit.log 40 \
            "proton_native unit suite"
