name: Delta Sync Integration

# Validates the rsync-over-SSH stack end-to-end against a local docker
# fixture. Cheap to run, scoped to paths that actually affect the feature
# so unrelated PRs don't pay for it.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/src/settings.rs'
      - 'src-tauri/src/ssh_exec.rs'
      - 'src-tauri/src/rsync_output.rs'
      - 'src-tauri/src/rsync_over_ssh.rs'
      - 'src-tauri/src/delta_transport.rs'
      - 'src-tauri/src/delta_sync_rsync.rs'
      # The native rsync wire implementation lives here and is the code
      # this job actually exercises end-to-end. Omitting it meant a
      # native-rsync change did not trigger this job at its own commit;
      # the regression only surfaced later when an unrelated filtered
      # path (Cargo.lock, lib.rs) triggered the job, producing
      # misleading "clean bisects" that blamed the triggering commit.
      - 'src-tauri/src/aerorsync/**'
      - 'src-tauri/src/providers/sftp.rs'
      - 'src-tauri/src/providers/scp/**'
      - 'src-tauri/tests/scp_openwrt.rs'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tests/fixtures/sftp-rsync/**'
      - 'src-tauri/tests/integration_delta_sync.rs'
      - '.github/workflows/delta-sync-integration.yml'
      - '.github/actions/apt-install/**'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/src/settings.rs'
      - 'src-tauri/src/ssh_exec.rs'
      - 'src-tauri/src/rsync_output.rs'
      - 'src-tauri/src/rsync_over_ssh.rs'
      - 'src-tauri/src/delta_transport.rs'
      - 'src-tauri/src/delta_sync_rsync.rs'
      - 'src-tauri/src/aerorsync/**'
      - 'src-tauri/src/providers/sftp.rs'
      - 'src-tauri/src/providers/scp/**'
      - 'src-tauri/tests/scp_openwrt.rs'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tests/fixtures/sftp-rsync/**'
      - 'src-tauri/tests/integration_delta_sync.rs'
      - '.github/workflows/delta-sync-integration.yml'
      - '.github/actions/apt-install/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: SFTP rsync fixture + live test (key-auth)
    runs-on: ubuntu-latest
    # 15 minutes was under the job's own runtime, so it died wherever the wall
    # happened to fall: on the integration test at 4df30affc and 45880d0a2, on
    # the post-job cache save at 8b39ed171, always reported as "cancelled"
    # rather than a failure. The sibling fallback-fixture job does comparable
    # work, is allowed 25, and takes about 16.
    #
    # 25 then turned out to be under the runtime too, twice (runs 30460276857
    # and 30488867618), both times inside the apt step. The job cap is the
    # worst place to die: GitHub cancels the job without naming a step and
    # marks every test `skipped`, which is indistinguishable at a glance from
    # a code defect. So the expensive steps below now carry their own budget
    # and the job cap is only a backstop. The arithmetic it has to cover:
    # ~1.6 min before apt, up to 12 for apt (one budget, archive restore and
    # save included), up to ~22 for the cargo steps on a cold cache, ~1 for
    # teardown and the cache save = ~37 in the usual slow case. The independently bounded cache, apt,
    # Docker and test steps can legitimately run longer in combination, so a
    # 40-minute backstop could still cancel an individually healthy step and
    # recreate the unattributed signal this layout is meant to prevent. The
    # declared sequential step limits total 109 minutes before checkout and
    # teardown, so 110 remains a finite backstop while leaving those named
    # budgets in charge.
    timeout-minutes: 110

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The aeroftp lib in test profile plus the docker fixture no longer fit
      # in the runner's free disk: this lane started dying with "No space left
      # on device" (or wedging until the job timeout) once the crate outgrew
      # the runner headroom (first red at d744affc). Same reclaim step
      # cli-smoke.yml and build.yml already use.
      # Best effort: a runner whose disk is slow can spend more than the
      # step's budget in `rm -rf`, and that alone must not fail the job
      # (red on 5d2e00026, run 36333451673). The budget stays, so a hang
      # still names this step; a disk that is then really too small fails
      # later with its own "No space left on device".
      - name: Free disk space
        timeout-minutes: 6
        continue-on-error: true
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1

      - name: Rust cache
        timeout-minutes: 15
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: './src-tauri -> target'
          # Family `linux-dev` (Actions cache quota, tracker Requested 76): every
          # ubuntu-latest job that builds the src-tauri test profile restores ONE
          # shared entry instead of writing its own 1-2 GB, and only the two jobs
          # that compile the whole lib save it: delta-sync-integration.yml
          # `integration` and aerorsync-protocol.yml `check`. A new job of the
          # same shape joins as a restore-only member (save-if false). Members
          # must hash the same environment: rust-cache puts every non-empty
          # CARGO*/RUST*/CC*/CFLAGS*/CXX*/CMAKE* variable into the key, so a
          # workflow-level one that changes no artefact (RUST_BACKTRACE) is
          # blanked on the rust-cache step and nowhere else. Never blank a CARGO*
          # one: cargo refuses an empty value and rust-cache's `cargo metadata`
          # fails, which changes the key too. Check a new member by its
          # "Cache Key" line, which must match this job's.
          shared-key: linux-dev
          # Saver of the family; PRs restore, only main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The 74 MB .deb download is this lane's whole observed failure mode: an
      # Azure mirror serving one runner at 43-170 kB/s while the next got
      # 7 MB/s (runs 30488867618, 39794879996, 39815053371). The shared action
      # owns the measurements: one bounded, resumable attempt that keeps the
      # budget instead of two 300s halves, and an archive cache that is saved
      # right after the install, also when it fails, and shared with every lane
      # that installs this stack, so a green lane warms the cache for a red one
      # and a rerun resumes instead of starting from zero.
      #
      # rsync + ssh client for the host side of the integration test; the
      # WebKit/GTK stack because compiling the aeroftp lib pulls Tauri deps even
      # when only one test binary runs. --no-install-recommends (inside the
      # action) matches every other Linux lane in this repo.
      - name: Install system dependencies
        timeout-minutes: 13
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            rsync openssh-client acl attr libacl1 libacl1-dev
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Generate fixture SSH key
        working-directory: src-tauri/tests/fixtures/sftp-rsync
        run: bash setup.sh

      # Measured at 4-6s, but it pulls a base image from Docker Hub, which this
      # repo has already seen time out (see aerorsync-protocol.yml).
      - name: Build & start docker fixture
        timeout-minutes: 10
        working-directory: src-tauri/tests/fixtures/sftp-rsync
        run: docker compose up -d --build

      - name: Wait for fixture SSH
        run: |
          for i in $(seq 1 20); do
            if ssh -i src-tauri/tests/fixtures/sftp-rsync/ssh_key \
                   -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -o BatchMode=yes \
                   -o ConnectTimeout=2 \
                   -p 2222 testuser@127.0.0.1 'true' 2>/dev/null; then
              echo "Fixture SSH ready after $((i * 2))s"
              exit 0
            fi
            echo "Waiting for fixture SSH... ($i/20)"
            sleep 2
          done
          echo "Fixture did not come up within 40s; dumping logs" >&2
          docker logs aeroftp-delta-sync-fixture >&2 || true
          exit 1

      # Measured at 9m42s and 9m49s on a warm rust-cache; the budget covers a
      # cold one, where this step also compiles the lib from scratch.
      - name: "Unit tests: delta-sync modules"
        timeout-minutes: 25
        working-directory: src-tauri
        # Five module filters, so a module renamed on one side and not here
        # silently narrows what this lane covers, down to nothing in the limit.
        # 70 is what the five select today (measured on PR #717); it is a floor
        # and not a count, because these modules are meant to grow. It came
        # down from 94 when the A3 crate tranche deleted the 29 tests of
        # `rsync_over_ssh::is_transient_for_reconnect`, whose cases moved into
        # the aerorsync module next to the predicate that replaced it, and
        # added 5 back on this side.
        run: |
          set -o pipefail
          cargo test --lib --no-fail-fast -- \
            rsync_output:: \
            rsync_over_ssh:: \
            ssh_exec:: \
            delta_transport:: \
            delta_sync_rsync:: | tee /tmp/delta-unit.log
          ../scripts/assert-tests-ran.sh /tmp/delta-unit.log 70 \
            "delta-sync module unit tests"

      # Measured at 3m55s and 4m04s.
      - name: "Integration test: delta sync over SSH"
        timeout-minutes: 15
        working-directory: src-tauri
        # 12 is the ignored set of this binary today. Selecting with `--ignored`
        # means removing those attributes empties the lane, so the count is what
        # separates "the fixture proved the round-trip" from "nothing ran".
        run: |
          set -o pipefail
          cargo test --test integration_delta_sync -- --ignored --nocapture \
            | tee /tmp/delta-integration.log
          ../scripts/assert-tests-ran.sh /tmp/delta-integration.log 12 \
            "delta sync over SSH"

      - name: Product-path native delta preserves ACL and xattr
        timeout-minutes: 10
        working-directory: src-tauri
        # `--exact` on one name: the tightest possible filter and therefore the
        # one that most easily matches nothing after a rename, with no signal
        # that it did. Exactly one, because this step promises one named test.
        run: |
          set -o pipefail
          cargo test --test integration_delta_sync \
            product_path_native_delta_preserves_acl_and_xattr -- \
            --ignored --nocapture --exact | tee /tmp/delta-acl-xattr.log
          ../scripts/assert-tests-ran.sh /tmp/delta-acl-xattr.log =1 \
            "Product-path ACL and xattr"

      # Measured at under a second against this fixture once the lib is built
      # by the steps above; the budget covers a cold link of the test binary.
      - name: Replacing a file in place, against a real SFTP server
        timeout-minutes: 15
        working-directory: src-tauri
        # G119. The two halves pull against each other and are asserted in one
        # run against one server: `rename` must keep REFUSING an occupied
        # destination, because that refusal is the only thing standing between
        # `mv a b` and the loss of an existing `b`, and `replace` must
        # overwrite it through `posix-rename@openssh.com`. A lane that checked
        # only the second could go green while the first silently turned into
        # a data-loss path.
        #
        # `=1` because this step promises exactly one test, and `--ignored`
        # selecting nothing prints a green about nothing.
        #
        # HOME is redirected because `russh` reads `known_hosts` out of it and
        # this fixture regenerates its host key on every build. On a runner
        # the file is empty anyway; the redirect is what makes the same
        # command work unchanged on a developer machine carrying a stale
        # `[127.0.0.1]:2222` line, which is a key CHANGE and is refused
        # whatever the trust setting says.
        env:
          HOME: ${{ runner.temp }}/sftp-replace-home
          AEROFTP_LIVE_SFTP_HOST: 127.0.0.1
          AEROFTP_LIVE_SFTP_PORT: "2222"
          AEROFTP_LIVE_SFTP_USER: testuser
          AEROFTP_LIVE_SFTP_KEY: ${{ github.workspace }}/src-tauri/tests/fixtures/sftp-rsync/ssh_key
          AEROFTP_LIVE_SFTP_DIR: /home/testuser
        run: |
          set -o pipefail
          mkdir -p "$HOME"
          cargo test --test live_sftp_replace -- --ignored --nocapture \
            | tee /tmp/sftp-replace.log
          ../scripts/assert-tests-ran.sh /tmp/sftp-replace.log =1 \
            "replace a file in place over SFTP"

      - name: Dump fixture logs on failure
        if: failure()
        working-directory: src-tauri/tests/fixtures/sftp-rsync
        run: |
          docker logs aeroftp-delta-sync-fixture || true
          docker compose ps

      - name: Teardown fixture
        if: always()
        working-directory: src-tauri/tests/fixtures/sftp-rsync
        run: docker compose down -v

  fallback-fixture:
    # PR-T02: covers the silent-fallback branch when the SFTP session
    # is password-only (delta path returns `None`, classic upload takes
    # over) and the offline hard-rejection contract. Runs in parallel
    # with the key-auth integration job so a regression in either lane
    # blocks the PR independently.
    name: SFTP password-only fixture + fallback contract
    runs-on: ubuntu-latest
    # Cold-cache PRs (Cargo.lock churn from deps bumps) compile the full
    # workspace + Tauri + aeroftp lib before the test binary links. The
    # sibling key-auth job needs ~11min on a warm shared cache; this lane
    # uses an isolated shared-key so the first cache miss can take 18-22
    # minutes.
    #
    # Same reasoning as the key-auth job above: the expensive steps carry
    # their own budget so a slow step is named, and this cap is only the
    # backstop. This lane has not been killed by the cap yet, but it installs
    # the same package set behind the same mirror and would have gone the same
    # way had the slowdown landed 30 seconds earlier.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Same disk reclaim as the key-auth lane above (this lane hit the same
      # "No space left on device" while rebuilding the lib for the second
      # cargo test invocation).
      # Best effort: a runner whose disk is slow can spend more than the
      # step's budget in `rm -rf`, and that alone must not fail the job
      # (red on 5d2e00026, run 36333451673). The budget stays, so a hang
      # still names this step; a disk that is then really too small fails
      # later with its own "No space left on device".
      - name: Free disk space
        timeout-minutes: 6
        continue-on-error: true
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1

      - name: Rust cache
        timeout-minutes: 15
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: './src-tauri -> target'
          # Restore-only member of `linux-dev` (see the key-auth job above).
          shared-key: linux-dev
          save-if: false

      # Same action and the same shared cache as the key-auth job: this lane
      # failed in apt three times on 2026-10-22 while the key-auth lane, which
      # had just fetched at 7 MB/s, held a complete entry under its own key.
      # sshpass polls the password-auth fixture's readiness (the test itself
      # uses russh through SftpProvider).
      - name: Install system dependencies
        timeout-minutes: 13
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            rsync openssh-client sshpass libacl1-dev
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Build & start password-auth docker fixture
        timeout-minutes: 13
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2; do
            echo "Build & start password-auth docker fixture: attempt ${attempt}/2"
            if timeout --signal=TERM --kill-after=30s 300s bash -euo pipefail -c '
              cd src-tauri/tests/fixtures/sftp-rsync
              docker compose -f docker-compose.password.yml up -d --build
            '; then
              ok=1
              break
            fi
            echo "attempt ${attempt} failed (timeout or docker error)" >&2
            if [ "$attempt" -lt 2 ]; then
              sleep 10
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "Build & start password-auth docker fixture failed after 2 attempts" >&2
            exit 1
          fi

      - name: Wait for password fixture SSH
        run: |
          for i in $(seq 1 20); do
            if sshpass -p testpass ssh \
                   -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -o BatchMode=no \
                   -o PreferredAuthentications=password \
                   -o PubkeyAuthentication=no \
                   -o ConnectTimeout=2 \
                   -p 2223 testuser@127.0.0.1 'true' 2>/dev/null; then
              echo "Password fixture SSH ready after $((i * 2))s"
              exit 0
            fi
            echo "Waiting for password fixture SSH... ($i/20)"
            sleep 2
          done
          echo "Password fixture did not come up within 40s; dumping logs" >&2
          docker logs aeroftp-delta-sync-fixture-password >&2 || true
          exit 1

      # Measured at 10m27s and 11m29s: this is where the lib gets compiled.
      - name: Offline hard-rejection contract
        timeout-minutes: 25
        working-directory: src-tauri
        # Non-ignored offline pins: no fixture needed but we run them
        # here too so a change that breaks the string contract without
        # touching the key-auth lane's paths is still caught.
        run: |
          set -o pipefail
          cargo test --test integration_delta_sync -- \
            hard_rejection_string_contract_is_pinned_offline \
            hard_error_branch_runs_before_classic_fallback_in_bivio \
            --nocapture | tee /tmp/delta-hard-rejection.log
          ../scripts/assert-tests-ran.sh /tmp/delta-hard-rejection.log 2 \
            "Offline hard-rejection contract"

      # Measured at 3m51s and 4m15s.
      #
      # The test named here was `product_path_falls_through_silently_when_
      # session_not_eligible` until 2026-05-16, when making password-backed
      # SFTP eligible for the native leg (host key pinned) inverted what it
      # asserts and it was renamed. This line was not updated, so from that day
      # the job built the password-only fixture, ran ZERO tests, printed
      # "test result: ok" and reported success: 0 executed on run 33434171154,
      # which is what the assertion below now makes impossible.
      - name: "Fallback integration test: password-only fixture"
        timeout-minutes: 15
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --test integration_delta_sync -- \
            --ignored \
            product_path_uses_native_delta_for_password_sftp_with_pinned_host_key \
            --nocapture | tee /tmp/delta-fallback.log
          ../scripts/assert-tests-ran.sh /tmp/delta-fallback.log =1 \
            "Password-only fixture contract"

      - name: Dump fixture logs on failure
        if: failure()
        working-directory: src-tauri/tests/fixtures/sftp-rsync
        run: |
          docker logs aeroftp-delta-sync-fixture-password || true
          docker compose -f docker-compose.password.yml ps

      - name: Teardown fixture
        if: always()
        working-directory: src-tauri/tests/fixtures/sftp-rsync
        run: docker compose -f docker-compose.password.yml down -v

  scp-openwrt-fixture:
    # SFTP going on over SCP against the router it was built for: the
    # official OpenWrt image, Dropbear and BusyBox, a blank root password and
    # no sftp-server. The test signs in as shipped, then with a password and
    # with a key it sets through `docker exec`.
    name: SCP fallback on stock OpenWrt
    runs-on: ubuntu-latest
    # Compiles the lib like the fallback-fixture job, under the same budget.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Free disk space
        timeout-minutes: 6
        continue-on-error: true
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1

      - name: Rust cache
        timeout-minutes: 15
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: linux-dev
          save-if: false

      - name: Install system dependencies
        timeout-minutes: 13
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            openssh-client libacl1-dev
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      # 24.10.4, pinned by digest: the release measured in
      # docs/dev/roadmap/APPENDIX-SCP-PROTOCOL (no stat, BusyBox ls).
      - name: Start OpenWrt
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run -d --name aeroftp-openwrt -p 127.0.0.1:2231:22 \
            openwrt/rootfs@sha256:1310ccbd24f30b3df6e210a48dbd0fb902445ee80e21ffc8b8e882b94987a411 \
            /sbin/init
          for i in $(seq 1 30); do
            if ssh-keyscan -p 2231 127.0.0.1 2>/dev/null | grep -q ssh-; then
              echo "Dropbear ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Dropbear did not come up within 60s" >&2
          docker logs aeroftp-openwrt >&2 || true
          exit 1

      - name: "SCP fallback test: stock OpenWrt"
        timeout-minutes: 25
        working-directory: src-tauri
        env:
          AEROFTP_OPENWRT_PORT: '2231'
          AEROFTP_OPENWRT_CONTAINER: aeroftp-openwrt
        run: |
          set -o pipefail
          cargo test --test scp_openwrt -- --ignored --nocapture \
            | tee /tmp/scp-openwrt.log
          ../scripts/assert-tests-ran.sh /tmp/scp-openwrt.log =1 \
            "SCP fallback on stock OpenWrt"

      - name: Dump router log on failure
        if: failure()
        run: docker exec aeroftp-openwrt logread || true

      - name: Teardown OpenWrt
        if: always()
        run: docker rm -f aeroftp-openwrt || true
