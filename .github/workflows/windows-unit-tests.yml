name: Windows Unit Tests

# Native Windows (MSVC) build checks and the Rust unit tests, on every pull
# request and push to main that changes the Rust crate. Every other Rust test
# runs on Linux; this is the only place a Rust assertion is evaluated on
# Windows, so it runs wherever a Rust change can break one, not only on the
# rsync/SFTP paths it was first scoped to (see the job comment below).

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/windows-unit-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/windows-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress; on
# main every commit keeps its own run.
concurrency:
  group: windows-unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-native:
    # PR-T11: validate the cross-OS surgical gate on Windows.
    # Since v3.6.1 `aerorsync` is in the default feature set,
    # so the "default features" matrix entry is the same as
    # "--features aerorsync". The two meaningful matrix entries
    # are now:
    #   - default (native prototype on): the shipping configuration
    #   - `--no-default-features`: the classic-only fallback path; on
    #     Windows this must compile to a `delta_transport() -> None`
    #     surface so the consumer drops silently to plain SFTP.
    # No live fixture on Windows: the CI image cannot reach a Linux rsync
    # server and the native prototype's live probe is covered by the
    # aerorsync-protocol.yml lane against the Linux fixture.
    name: Windows cross-OS build + native unit tests
    # Pin to windows-2022 while cmake-rs (crate `cmake` 0.1.58 used
    # transitively by whisper-rs-sys 0.15.0) hardcodes the generator
    # string `Visual Studio 18 2026` whenever it detects MSVC v18 on
    # the runner, but CMake itself does not yet know that generator.
    # Same root cause that hit cli-smoke and was patched in v3.7.2.
    # windows-2022 still ships VS 17 2022, which both cmake-rs and
    # CMake support.
    runs-on: windows-2022
    # MSVC links roughly 2x slower than ubuntu-latest on the large
    # lib target; the single-config run used to fit in 20 min but the
    # v3.6.1 default-feature change doubled the amount of code the
    # test binary pulls in. 40 min was the comfortable ceiling for the
    # two compile-surface checks alone. The unit-test step added below
    # links and runs a third configuration and carries its own 30-minute
    # budget, so the job cap has to sit above the sum or it would cancel
    # a step that is still inside the budget it was given, which is the
    # unattributed signal the Linux jobs of delta-sync-integration.yml go out of their way to
    # avoid. 80 = 40 for the two checks, 30 for the test step, ~10 for
    # checkout, cache restore and the CMake purge. Raised again on 2026-09-18
    # once the test step was split in two and measured: 40 for the two compile
    # surface checks, 40 for building the test binary (18m54s cold, with room
    # for a slower runner), 45 for running 3916 tests, and 10 for checkout,
    # cache restore and the CMake purge.
    timeout-minutes: 135

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust (stable, msvc)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: delta-sync-windows
          # Mirror the prefix bumped in build.yml / cli-smoke.yml on
          # 2026-05-06 to invalidate any cached whisper-rs-sys
          # CMakeCache.txt referencing Visual Studio 17 2022 after the
          # windows-latest image rolled to VS 18 2026. windows-2022 is
          # also pinned above as belt-and-suspenders, but if the pin is
          # ever lifted we still want the cache invalidation in place.
          prefix-key: 'v2-whisper-vs18'
          # PRs restore; only main saves (Actions cache quota is 10 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # whisper-rs-sys vendors whisper.cpp and runs CMake at build time.
      # The generator picked by cmake-rs is whichever Visual Studio
      # CMake finds on the runner. When GitHub rolls the image to a
      # newer VS, the rust-cache restored CMakeCache.txt still
      # references the previous generator and CMake aborts. Belt-and-
      # suspenders: drop the whole `whisper-rs-sys-*` tree (debug and
      # release) so cmake-rs reconfigures cleanly. Removing only `out/`
      # used to leave `out/build/CMakeCache.txt` behind on some runners
      # depending on cmake-rs internal layout.
      - name: Drop stale whisper-rs-sys CMake artifacts (Windows)
        shell: pwsh
        run: |
          foreach ($profile in @('debug', 'release')) {
            $base = "src-tauri/target/$profile/build"
            $purged = 0
            if (Test-Path $base) {
              Get-ChildItem $base -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'whisper-rs-sys-*' } |
                ForEach-Object {
                  Write-Host "Removing whole whisper-rs-sys build dir: $($_.FullName)"
                  Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue
                  $purged++
                }
              Write-Host "[$profile] Purged $purged whisper-rs-sys build dir(s)"
            }
          }

      # The two checks below and the test build fail on any warning from this
      # crate. Clippy with -D warnings runs only on Linux (build.yml,
      # linux-validate), so code compiled only here, and items whose only users
      # sit behind a unix cfg, built with warnings nobody had to read: run
      # 38072169081 printed 19 distinct rustc warnings across these three steps.
      # `build.warnings` counts this crate's warnings only (build-script
      # `cargo:warning` lines do not count, linker output reported through the
      # `linker_messages` lint does) and, unlike RUSTFLAGS, changes no
      # fingerprint, so it costs no rebuild; RUSTFLAGS would also replace the
      # `+crt-static` rustflags of src-tauri/.cargo/config.toml. A warning here
      # is fixed by giving the item the cfg of the code that uses it.
      #
      # Compile-surface gate for the classic-only fallback path:
      # `--no-default-features` turns `aerorsync` off, and on
      # Windows the binary-rsync transport is also gated out. The only
      # thing that should survive on this path is
      # `SftpProvider::delta_transport() -> None`, which the consumer
      # treats as "drop to plain SFTP silently". Regression here means
      # the surgical `#[cfg(unix)]` gate has leaked a Unix-only symbol
      # back into the cross-OS surface.
      - name: cargo check (--no-default-features, classic-only fallback)
        working-directory: src-tauri
        run: cargo check --locked --no-default-features --config 'build.warnings="deny"'

      # Compile-surface gate for the shipping configuration (default
      # features, which include `aerorsync`). This confirms
      # the native rsync driver, the type layer
      # (`RsyncCapability`/`RsyncConfig`/`RsyncError`/`RsyncStats`),
      # the cross-platform adapter, and `SftpProvider::delta_transport()`
      # all build cleanly under MSVC with the feature on.
      - name: "cargo check (default features: shipping configuration)"
        working-directory: src-tauri
        run: cargo check --locked --all-targets --config 'build.warnings="deny"'
      # G105, 2026-09-18. Until today this job's name promised "native
      # unit tests" and it ran none: every `cargo test` in the repository
      # executes on a Linux runner, so no Rust assertion had ever been
      # evaluated on Windows. The note that used to close this file called a
      # Windows test runner a follow-up, no follow-up was ever opened, and
      # the gap turned into a belief ("CI checks Windows anyway") that was
      # stated to a peer as fact. The note is replaced by the thing it
      # promised.
      #
      # What unblocks it is the feature set, not a toolchain fix. The link
      # failures the old note describes are `whisper-rs-sys`'s: its vendored
      # ggml sources do not resolve the MSVC CRT import stubs (`__imp_rand`,
      # `__imp__aligned_malloc`, `__imp_expm1f`, `__imp_fmaxf`, `__imp_erff`)
      # in the `cargo test` profile. `--no-default-features --features
      # aerorsync` turns `local-stt` off, which drops that C/C++ stack
      # entirely while keeping the native rsync driver on. Cargo.toml
      # documents that exact combination as the workaround for the same
      # drift, so this lane is not inventing a configuration, it is running
      # the one already declared.
      #
      # One declared limit, leaning the way that costs us: the configuration
      # under test is NOT the shipping one (speech is off), so this proves the
      # cross-platform assertions hold on MSVC, not that the shipping test
      # closure links.
      #
      # Until 2026-10-09 this job lived in delta-sync-integration.yml and ran
      # only when its rsync/SFTP paths changed, so a Windows-only regression
      # elsewhere reached main with no Windows assertion behind it: #1123 put
      # a test on main that failed on Windows, and its own PR never ran this
      # job. It now has its own workflow, which runs on every change under
      # src-tauri/.
      #
      # `--no-fail-fast` because the first runs of a suite that has never
      # executed on this OS should report every divergence at once rather
      # than one per red run.
      # Split from the run below so that "the build took too long" and "the
      # tests took too long" cannot be confused for each other. Measured on the
      # first run that got this far, 2026-09-18: the compile took 18m54s cold
      # and the tests were still going at the 30 minute wall with 1617 of 3916
      # reported. A single step with one budget said only "timed out", which is
      # the unattributed signal the Linux jobs of delta-sync-integration.yml are built to avoid.
      #
      # The cache is restored but never saved on a branch (save-if below), so
      # cold is the case to budget for; once this lands on main and main saves,
      # the compile here is mostly a restore.
      - name: Build the test binary (MSVC)
        working-directory: src-tauri
        timeout-minutes: 40
        env:
          AEROFTP_EMBED_TEST_MANIFEST: "1"
        run: cargo test --locked --lib --no-default-features --features aerorsync --no-run --config 'build.warnings="deny"'

      - name: "Unit tests: cross-platform assertions under MSVC"
        working-directory: src-tauri
        env:
          # Without this the test executable links and then dies with
          # 0xC0000139 before `main`, reporting the target as failed with no
          # test output at all. build.rs embeds the Common-Controls 6.0
          # manifest only when this is set, because the flags it uses reach
          # every linked target and the packaged application already has a
          # manifest of its own. Here the only thing being linked is the test
          # binary, which is what makes the scope safe.
          AEROFTP_EMBED_TEST_MANIFEST: "1"
        # Its own budget, like the expensive steps in the delta-sync Linux jobs:
        # if this step dies it has to die naming itself.
        timeout-minutes: 45
        run: cargo test --locked --lib --no-default-features --features aerorsync --no-fail-fast
