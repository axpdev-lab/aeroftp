name: Aerorsync Protocol

# Dedicated workflow for the `aerorsync` native rsync wire-protocol module.
# The production `build.yml` workflow stays untouched: this file lives
# next to it and is entirely additive.
#
# Originally created as `strada-c-prototype.yml` while the module was an
# opt-in experiment; renamed in v3.6.3 because `aerorsync` has been
# mainline + default-on since v3.6.1 and is no longer a prototype.
# The `strada-c-*` branch triggers below are kept for back-compat with
# in-flight feature branches; all new work targets `main`.
#
# Triggering policy (Y-RSC.1 / Y-RSC.8):
#   * The whole workflow is path-filtered to the module and the inputs
#     that can change its behaviour (module tree, Cargo manifests, this
#     file), same technique as delta-sync-integration.yml. A push that
#     does not touch them skips every job.
#   * push / PR on `main` and `strada-c-**` -> check (full module suite)
#     + Docker lane 3 (stock rsync).
#   * Docker lane 2 (native aerorsync_serve / RSNP) was retired in
#     Y-RSC.8 with the legacy SessionDriver stack.
#
# The lane3 Docker job needs `src-tauri/src/aerorsync/capture/`
# (Docker fixtures, ssh keys, compose files); on `main` that subtree is
# present but the artifact directories underneath are gitignored.

on:
  push:
    branches:
      - main
      - 'strada-c-**'
    paths:
      - 'src-tauri/src/aerorsync/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/aerorsync-protocol.yml'
  pull_request:
    branches:
      - main
      - 'strada-c-**'
    paths:
      - 'src-tauri/src/aerorsync/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/aerorsync-protocol.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # check: full verification block. Runs on every event the paths
  # filter lets through (main and strada-c-*, push and PR). Mirrors the
  # local manual verification the handoff doc requires. The final
  # feature-off step also covers what the old main-smoke job checked,
  # which is why that job could be retired when main joined the matrix.
  # ------------------------------------------------------------------
  check:
    name: check + clippy + mock suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libzstd-dev
      - name: cargo check --features aerorsync --lib
        working-directory: src-tauri
        run: cargo check --features aerorsync --lib
      - name: cargo clippy (strict, -D warnings)
        working-directory: src-tauri
        run: cargo clippy --lib --features aerorsync --all-targets -- -D warnings
      - name: Mock + unit test suite
        working-directory: src-tauri
        run: cargo test --features aerorsync --lib aerorsync
      - name: Default build regression (feature off)
        working-directory: src-tauri
        run: cargo check --lib

  # ------------------------------------------------------------------
  # lane3: Docker-backed lane 3: a real `rsync 3.2.7` server over SSH.
  # The tests drive the full upload + finish_session round-trip (bulk
  # and streaming) against a live rsync and surface any regression in
  # the native protocol implementation immediately. A hard gate on
  # every path-matched push to main and on strada-c-* branches.
  # ------------------------------------------------------------------
  lane3:
    name: Docker lane 3 (real rsync 3.2.7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      # Same reclaim step delta-sync-integration.yml, cli-smoke.yml and
      # build.yml already use: the lib in test profile plus the Docker
      # fixture do not fit in the runner's free disk on a cold cache.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h /
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libzstd-dev netcat-openbsd
      - name: Start real-rsync harness
        working-directory: src-tauri/src/aerorsync/capture
        run: |
          chmod 600 keys/id_ed25519
          docker compose -f docker-compose.real-rsync.yml up -d --build
      - name: Wait for sshd (real rsync, port 2224)
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 2224; then echo "sshd up"; exit 0; fi
            sleep 1
          done
          echo "::error::real-rsync harness failed to open port 2224"
          exit 1
      - name: Run lane 3 live tests (bulk + streaming)
        working-directory: src-tauri
        env:
          RUSTFLAGS: '--cfg ci_lane3'
        # Both filters go after `--`: cargo itself takes a single
        # positional TESTNAME, libtest ORs multiple filters.
        run: |
          cargo test --features aerorsync --lib -- \
            aerorsync::native_driver::tests::driver_upload_live_lane_3_real_rsync_byte_identical \
            aerorsync::native_driver::tests::driver_upload_streaming_live_lane_3_real_rsync_byte_identical \
            aerorsync::delta_transport_impl::tests::delta_upload_symlink_live_lane_3_readlink_identical \
            aerorsync::delta_transport_impl::tests::delta_download_symlink_live_lane_3_readlink_identical \
            --nocapture
      - name: Tear down harness
        if: always()
        working-directory: src-tauri/src/aerorsync/capture
        run: docker compose -f docker-compose.real-rsync.yml down -v
