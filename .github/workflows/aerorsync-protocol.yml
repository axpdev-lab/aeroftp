name: Aerorsync Protocol

# Dedicated workflow for the `aerorsync` native rsync wire-protocol module.
# The production `build.yml` workflow stays untouched: this file lives
# next to it and is entirely additive.
#
# Originally created as `strada-c-prototype.yml` while the module was an
# opt-in experiment; renamed in v3.6.3 because `aerorsync` has been
# mainline + default-on since v3.6.1 and is no longer a prototype.
# The `strada-c-*` branch triggers below are kept for back-compat with
# in-flight feature branches; all new work targets `main`.
#
# Triggering policy (Y-RSC.1 / Y-RSC.8):
#   * The whole workflow is path-filtered to the module and the inputs
#     that can change its behaviour (module tree, Cargo manifests, this
#     file), same technique as delta-sync-integration.yml. A push that
#     does not touch them skips every job.
#   * push / PR on `main` and `strada-c-**` -> check (full module suite)
#     + Docker lane 3 (stock rsync) + deflate oracle (rsync 3.1.3).
#   * Docker lane 2 (native aerorsync_serve / RSNP) was retired in
#     Y-RSC.8 with the legacy SessionDriver stack.
#
# The lane3 Docker job needs `src-tauri/src/aerorsync/capture/`
# (Docker fixtures, ssh keys, compose files); on `main` that subtree is
# present but the artifact directories underneath are gitignored.

on:
  push:
    branches:
      - main
      - 'strada-c-**'
    paths:
      - 'src-tauri/src/aerorsync/**'
      - 'src-tauri/src/providers/sftp.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/aerorsync-protocol.yml'
  pull_request:
    branches:
      - main
      - 'strada-c-**'
    paths:
      - 'src-tauri/src/aerorsync/**'
      - 'src-tauri/src/providers/sftp.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/aerorsync-protocol.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # check: full verification block. Runs on every event the paths
  # filter lets through (main and strada-c-*, push and PR). Mirrors the
  # local manual verification the handoff doc requires. The final
  # feature-off step also covers what the old main-smoke job checked,
  # which is why that job could be retired when main joined the matrix.
  # ------------------------------------------------------------------
  check:
    name: check + clippy + mock suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        run: |
          # Runner-image extras: Microsoft's apt repos 403 on their InRelease often
          # enough to redden a run, and nothing here installs from them.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure-cli*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libzstd-dev libacl1 libacl1-dev
      - name: cargo check --features aerorsync --lib
        working-directory: src-tauri
        run: cargo check --features aerorsync --lib
      - name: cargo clippy (strict, -D warnings)
        working-directory: src-tauri
        run: cargo clippy --lib --features aerorsync --all-targets -- -D warnings
      # `aerorsync` is a substring filter over the whole lib, which is the shape
      # that prints "test result: ok" and exits 0 when it matches nothing: rename
      # the module and this step passes having compiled the crate and run no
      # test. 677 is what it executes today (692 selected, 15 of them ignored,
      # measured on run 33436715702 and reproduced locally); a floor, because the
      # module is meant to grow.
      - name: Mock + unit test suite
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --features aerorsync --lib aerorsync | tee /tmp/aerorsync-unit.log
          ../scripts/assert-tests-ran.sh /tmp/aerorsync-unit.log 677 \
            "aerorsync mock + unit suite"
      - name: Default build regression (feature off)
        working-directory: src-tauri
        run: cargo check --no-default-features --lib

  # ------------------------------------------------------------------
  # deflate-oracle: builds upstream rsync 3.1.3 from a SHA-256-pinned
  # Samba tarball and forces a stock protocol-31 client onto zlibx.
  # The harness captures both SSH exec streams, requires real literal
  # and matched data, verifies both final files, then feeds the fresh
  # upload transcript through AeroRsync's production token + deflate
  # decoders. This is deliberately separate from lane3's zstd peer.
  # ------------------------------------------------------------------
  deflate-oracle:
    name: Docker deflate oracle (rsync 3.1.3 zlibx)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Install Linux system deps
        run: |
          # Runner-image extras: Microsoft's apt repos 403 on their InRelease often
          # enough to redden a run, and nothing here installs from them.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure-cli*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libzstd-dev libacl1-dev
      - name: Pre-pull harness base image
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3 4; do
            if docker pull debian:bookworm-slim; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Docker Hub unreachable after ${attempt} attempts pulling debian:bookworm-slim"
              exit "$status"
            fi
            sleep $((attempt * 15))
          done
      - name: Capture and verify rsync 3.1.3 zlibx tokens
        working-directory: src-tauri/src/aerorsync/capture
        run: ./run_deflate_rsync_capture.sh

  # ------------------------------------------------------------------
  # lane3: Docker-backed lane 3: a real `rsync 3.2.7` server over SSH.
  # The tests drive the full upload + finish_session round-trip (bulk
  # and streaming) against a live rsync and surface any regression in
  # the native protocol implementation immediately. A hard gate on
  # every path-matched push to main and on strada-c-* branches.
  # ------------------------------------------------------------------
  lane3:
    name: Docker lane 3 (real rsync 3.2.7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      # Same reclaim step delta-sync-integration.yml, cli-smoke.yml and
      # build.yml already use: the lib in test profile plus the Docker
      # fixture do not fit in the runner's free disk on a cold cache.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h /
      - name: Install Linux system deps
        run: |
          # Runner-image extras: Microsoft's apt repos 403 on their InRelease often
          # enough to redden a run, and nothing here installs from them.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure-cli*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libzstd-dev netcat-openbsd \
            acl libacl1 libacl1-dev
      # Docker Hub (registry-1.docker.io) occasionally times out on GHA runners
      # (observed 2026-07-26 06:49Z: dial tcp ...:443: i/o timeout while loading
      # debian:bookworm-slim metadata for Dockerfile.real-rsync-sshd). That used
      # to paint the whole lane red before any test ran, indistinguishable from
      # a protocol regression. Pull the base image first with its own retry so
      # a registry blip is named in the log; then retry compose up --build.
      # Gate stays hard: no continue-on-error — only recoverable retries.
      - name: Pre-pull harness base image
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3 4; do
            # Capture the status in the `else` branch: after a plain `if` with
            # no `else`, `$?` is the status of the `if` itself, which is 0 when
            # the condition was false, so `exit "$status"` below would have
            # exited 0 and painted this step green with the registry down.
            if docker pull debian:bookworm-slim; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Docker Hub unreachable after ${attempt} attempts pulling debian:bookworm-slim (registry-1.docker.io). Not a protocol regression — registry/network failure."
              exit "$status"
            fi
            echo "::warning::Docker Hub pull of debian:bookworm-slim failed on attempt ${attempt}/4 (registry-1.docker.io); retrying"
            sleep $((attempt * 15))
          done
      - name: Start real-rsync harness
        working-directory: src-tauri/src/aerorsync/capture
        shell: bash
        run: |
          set -u
          chmod 600 keys/id_ed25519
          for attempt in 1 2 3; do
            # Same as the pre-pull step above: `$?` after a plain `if` is the
            # status of the `if`, not of the condition, so the status has to be
            # taken in an `else` branch or the final `exit "$status"` exits 0.
            # HOST_UID/HOST_GID build the container's testuser with the
            # runner's uid, so the files `rsync --server` writes into the
            # bind-mounted workspace stay writable by the tests that seed
            # them from the host side. Without it the harness owns the mount
            # as uid 1000 and the RSNP_TEST_REAL upload tests die on
            # PermissionDenied halfway through.
            if HOST_UID=$(id -u) HOST_GID=$(id -g) \
                 docker compose -f docker-compose.real-rsync.yml up -d --build; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::real-rsync harness build/start failed after ${attempt} attempts. If the log shows registry-1.docker.io / DeadlineExceeded / i/o timeout, this is Docker Hub, not a protocol regression."
              exit "$status"
            fi
            echo "::warning::real-rsync harness compose up --build failed on attempt ${attempt}/3; retrying"
            sleep $((attempt * 15))
          done
      - name: Wait for sshd (real rsync, port 2224)
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 2224; then echo "sshd up"; exit 0; fi
            sleep 1
          done
          echo "::error::real-rsync harness failed to open port 2224"
          exit 1
      - name: Run lane 3 live tests (bulk + streaming)
        working-directory: src-tauri
        env:
          RUSTFLAGS: '--cfg ci_lane3'
        # All filters go after `--`: cargo itself takes a single
        # positional TESTNAME, libtest ORs multiple filters.
        run: |
          set -o pipefail
          cargo test --features aerorsync --lib -- \
            aerorsync::native_driver::tests::driver_upload_live_lane_3_real_rsync_byte_identical \
            aerorsync::native_driver::tests::driver_upload_streaming_live_lane_3_real_rsync_byte_identical \
            aerorsync::delta_transport_impl::tests::delta_upload_symlink_live_lane_3_readlink_identical \
            aerorsync::delta_transport_impl::tests::delta_download_symlink_live_lane_3_readlink_identical \
            aerorsync::delta_transport_impl::tests::delta_upload_unsupported_compressor_live_lane_3_routes_to_fallback \
            aerorsync::delta_transport_impl::tests::delta_upload_unsupported_checksum_live_lane_3_routes_to_fallback \
            aerorsync::delta_transport_impl::tests::delta_upload_xattr_inline_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_upload_xattr_oob_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_upload_xattr_binary_nul_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_upload_xattr_none_with_x_flag_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_download_xattr_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_upload_xattr_batch_two_files_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_upload_symlink_xattr_not_inherited_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_upload_acl_named_user_live_lane_3 \
            aerorsync::delta_transport_impl::tests::delta_download_acl_named_user_live_lane_3 \
            --nocapture | tee /tmp/aerorsync-lane3.log
          ../scripts/assert-tests-ran.sh /tmp/aerorsync-lane3.log 15 \
            "lane 3 live tests"
      # The RSNP_TEST_REAL lane: eight #[ignore] tests that drive the
      # production AerorsyncDeltaTransport upload and download paths against
      # the same stock rsync, with each negotiated checksum forced in turn
      # (xxh128, xxh3, xxh64, md5, md4, sha1).
      #
      # Until now nothing set RSNP_TEST_REAL_SSH_KEY, so every one of them
      # took its early return, printed one line to stderr and reported **ok**.
      # libtest has no skipped state, so eight tests that never ran looked
      # exactly like eight that passed, and the production delta upload path
      # went without live coverage while the suite stayed green.
      # RSNP_TEST_REAL_REQUIRED=1 makes the missing configuration a panic, so
      # this step cannot go back to passing by doing nothing.
      - name: Seed the real-rsync lane fixtures
        working-directory: src-tauri/src/aerorsync/capture
        shell: bash
        run: |
          set -eu
          mkdir -p workspace/real/download workspace/real/upload workspace/real/local
          python3 - <<'PY'
          import os, random
          random.seed(20260728)
          src = bytes(random.getrandbits(8) for _ in range(256 * 1024))
          basis = bytearray(src)
          for off in (4096, 60000, 200000):
              basis[off:off+512] = bytes(random.getrandbits(8) for _ in range(512))
          root = 'workspace/real'
          open(f'{root}/download/target.bin', 'wb').write(src)
          open(f'{root}/upload/target.bin', 'wb').write(bytes(basis))
          open(f'{root}/local/upload.bin', 'wb').write(src)
          os.makedirs('/tmp/aerorsync-lane', exist_ok=True)
          open('/tmp/aerorsync-lane/expected.bin', 'wb').write(src)
          for suffix in ('', '_MD5', '_MD4', '_SHA1'):
              open(f'/tmp/aerorsync-lane/local{suffix}.bin', 'wb').write(bytes(basis))
          PY
      - name: Run the real-rsync lane (checksum matrix, upload + download)
        working-directory: src-tauri
        env:
          RSNP_TEST_REAL_REQUIRED: '1'
          RSNP_TEST_REAL_SSH_KEY: ${{ github.workspace }}/src-tauri/src/aerorsync/capture/keys/id_ed25519
          RSNP_TEST_REAL_HOST: 127.0.0.1
          RSNP_TEST_REAL_PORT: '2224'
          RSNP_TEST_REAL_USER: testuser
          RSNP_TEST_REAL_WORKSPACE: ${{ github.workspace }}/src-tauri/src/aerorsync/capture/workspace/real
          RSNP_TEST_REAL_REMOTE_DOWNLOAD_TARGET: /workspace/real/download/target.bin
          RSNP_TEST_REAL_REMOTE_UPLOAD_TARGET: /workspace/real/upload/target.bin
          RSNP_TEST_REAL_EXPECT_DOWNLOAD_FILE: /tmp/aerorsync-lane/expected.bin
          RSNP_TEST_REAL_LOCAL_DOWNLOAD_FILE: /tmp/aerorsync-lane/local.bin
          RSNP_TEST_REAL_LOCAL_DOWNLOAD_FILE_MD5: /tmp/aerorsync-lane/local_MD5.bin
          RSNP_TEST_REAL_LOCAL_DOWNLOAD_FILE_MD4: /tmp/aerorsync-lane/local_MD4.bin
          RSNP_TEST_REAL_LOCAL_DOWNLOAD_FILE_SHA1: /tmp/aerorsync-lane/local_SHA1.bin
        # --test-threads=1: the checksum override is a process-global env var.
        #
        # The count check is not belt-and-braces. This selects tests BY NAME and
        # only the ignored ones, and `cargo test` prints "test result: ok" and
        # exits 0 when a filter matches nothing. So renaming the module, or
        # removing `#[ignore]` from these tests to make them run more often,
        # would turn this lane green having executed NOTHING, and the second one
        # looks like an improvement while doing it. `set -o pipefail` matters for
        # the same reason: without it the exit status would be tee's, not cargo's.
        # The check itself now lives in scripts/assert-tests-ran.sh, which is
        # where the shell subtleties it needs are written down once instead of
        # once per lane.
        run: |
          set -o pipefail
          cargo test --features aerorsync --lib aerorsync::live_tests -- \
            --ignored --nocapture --test-threads=1 | tee /tmp/aerorsync-live.log
          ../scripts/assert-tests-ran.sh /tmp/aerorsync-live.log 8 \
            "aerorsync live checksum-matrix tests"
      - name: Tear down harness
        if: always()
        working-directory: src-tauri/src/aerorsync/capture
        run: docker compose -f docker-compose.real-rsync.yml down -v
