name: DCO

# Verifies that every commit in a pull request carries a Developer Certificate
# of Origin sign-off (see the DCO file at the repository root).
#
# Deliberately self-contained: this is a supply-chain sensitive check, so it
# uses no third-party action beyond the official checkout.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-sign-off:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit must be signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          checked=0
          # Assignments, so that set -e sees a failing git: a `for` over
          # $(git rev-list ...) loops over nothing when git fails, and the
          # check then printed its success line. A pull request has at least
          # one commit, so an empty range is a range read wrong.
          # Tests: .github/scripts/test_dco_check.py
          total=$(git rev-list --count "$BASE".."$HEAD")
          if [ "$total" -eq 0 ]; then
            echo "::error::no commits between $BASE and $HEAD, so no sign-off was checked"
            exit 1
          fi
          # Merge commits are exempt: their content is signed off on the branch.
          commits=$(git rev-list --no-merges "$BASE".."$HEAD")
          for sha in $commits; do
            checked=$((checked + 1))
            author_name=$(git show -s --format='%an' "$sha")
            author_mail=$(git show -s --format='%ae' "$sha")
            case "$author_mail" in
              *'[bot]@users.noreply.github.com')
                # A GitHub App picks neither of its two addresses. It authors
                # with the NNN+name[bot]@users.noreply.github.com that GitHub
                # issues for the app, and signs off with the app's own contact
                # address: Dependabot authors as
                # 49699333+dependabot[bot]@users.noreply.github.com and writes
                # Signed-off-by: dependabot[bot] <support@github.com>. Requiring
                # the two to match leaves every bot pull request permanently red
                # over a difference nobody can amend. Match the app by name and
                # take the address it signs with; the sign-off is still
                # required, only its address is not compared.
                expected="Signed-off-by: ${author_name} <"
                shown="Signed-off-by: ${author_name} <the address the app signs with>"
                ;;
              *)
                expected="Signed-off-by: ${author_name} <${author_mail}>"
                shown="$expected"
                ;;
            esac
            # Anchor on real sign-off LINES before the substring match: a commit
            # that quotes "Signed-off-by: ..." inside prose must not pass.
            if git show -s --format='%B' "$sha" | grep -i '^Signed-off-by:' | grep -qiF "$expected"; then
              continue
            fi
            echo "::error::commit $sha is missing '$shown'"
            git show -s --format='  %h %s' "$sha"
            missing=1
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add the sign-off by amending or rebasing with -s, for example:"
            echo "  git commit --amend -s --no-edit"
            echo "  git rebase --signoff $BASE"
            echo ""
            echo "The sign-off must match the commit author; a GitHub App is matched"
            echo "by name, since it cannot pick either of its two addresses. It certifies"
            echo "the Developer Certificate of Origin, see the DCO file in the repo root."
            exit 1
          fi
          if [ "$checked" -eq 0 ]; then
            echo "Only merge commits in the range ($total), which are exempt."
          else
            echo "All commits are signed off ($checked checked)."
          fi
