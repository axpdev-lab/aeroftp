# Dependabot configuration: automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Rust (Cargo) dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # DO NOT allow tauri 2.11.x. Dependabot PR #201 bumped tauri
      # =2.11.0 -> =2.11.1; 2.11.1's is_local_url() classifies the Linux
      # production webview origin http://127.0.0.1:14321 as remote and
      # rejects every custom command, making all Linux builds
      # non-functional (v3.8.2 regression, fixed in v3.8.3). Windows and
      # macOS use the tauri:// App protocol and are unaffected. Keep
      # =2.11.0 in Cargo.toml; unblock only with a deliberate migration.
      - dependency-name: "tauri"
        versions: [">=2.11.1"]
      - dependency-name: "tauri-build"
        versions: [">=2.11.1"]
      - dependency-name: "suppaftp"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zip"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dirs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "portable-pty"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "indicatif"
        update-types: ["version-update:semver-major"]
      - dependency-name: "notify-debouncer-full"
        update-types: ["version-update:semver-major"]
      - dependency-name: "windows"
        update-types: ["version-update:semver-patch", "version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "rusqlite"
        update-types: ["version-update:semver-major"]
      # ── RustCrypto digest 0.11 / hmac 0.13 migration block ──────────
      # sha1/sha2/md-5/ripemd 0.11+, hkdf 0.13 and pbkdf2 0.13 all pull
      # digest 0.11, but the wider graph (hmac, the aes-* AEAD wrappers)
      # is still on digest 0.10 / aes 0.8. Taking any one of these in
      # isolation forks the trait crates and breaks the build. Unblock
      # only when the whole RustCrypto stack moves together.
      - dependency-name: "sha1"
        versions: [">=0.11.0"]
      - dependency-name: "sha2"
        versions: [">=0.11.0"]
      - dependency-name: "md-5"
        versions: [">=0.11.0"]
      - dependency-name: "ripemd"
        versions: [">=0.2.0"]
      - dependency-name: "hkdf"
        versions: [">=0.13.0"]
      - dependency-name: "pbkdf2"
        versions: [">=0.13.0"]
      - dependency-name: "hmac"
        versions: [">=0.13.0"]
      # num-bigint-dig 0.9 requires rand 0.9, incompatible with rsa 0.9
      # which depends on num-bigint-dig 0.8. Unblock when rsa 0.10 stable.
      - dependency-name: "num-bigint-dig"
        versions: [">=0.9.0"]
      # aes 0.9 is a breaking RustCrypto block-cipher bump. aes-gcm 0.10,
      # aes-kw 0.2, aes-siv 0.7 and aes-gcm-siv 0.11 (AeroVault v3) all
      # still depend on aes 0.8; taking aes 0.9 directly forks the cipher
      # crate and breaks the AEAD wrappers. Unblock when aes-gcm/aes-kw/
      # aes-siv/aes-gcm-siv ship releases built on aes 0.9.
      - dependency-name: "aes"
        versions: [">=0.9.0"]

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@xterm/xterm"
        update-types: ["version-update:semver-major"]
      # React 19 is a deliberate framework migration, not an auto-bump.
      # Hold the major (and its @types, bumped in the same PR) until the
      # migration is scheduled; minor/patch still flow.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "softprops/action-gh-release"
        update-types: ["version-update:semver-major"]
