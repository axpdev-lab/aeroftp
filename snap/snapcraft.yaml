name: aeroftp
title: AeroFTP
version: '4.2.5'
summary: Modern Multi-Protocol File Transfer & Cloud Client for Humans and Agents
description: |
  AeroFTP is a modern file transfer client that goes beyond traditional FTP.
  Connect to FTP/FTPS servers, SFTP, WebDAV, S3-compatible storage, and major
  cloud providers, all from a single, elegant interface.

  Supported Protocols:
  - FTP / FTPS (TLS 1.3)
  - SFTP (SSH File Transfer)
  - WebDAV (Nextcloud, CloudMe, Seafile, DriveHQ)
  - S3-compatible (AWS, Backblaze B2, Wasabi, MinIO, and more)
  - Google Drive (OAuth2)
  - Dropbox (OAuth2)
  - OneDrive (OAuth2)
  - MEGA.nz (E2E encryption)
  - Filen (E2E encryption)
  - Box, pCloud (OAuth2)
  - Azure Blob Storage (HMAC)
  - 4shared (OAuth 1.0)
  - Zoho WorkDrive (OAuth2, 8 regional endpoints)
  - Internxt Drive (E2E, zero-knowledge)
  - kDrive (Infomaniak)
  - Koofr (EU-based, OAuth2 PKCE)
  - Jottacloud (Norwegian-hosted, unlimited plans)
  - FileLu (API Key, file passwords, privacy toggle)
  - Yandex Disk (OAuth2)
  - OpenDrive (native API)
  - GitHub (repository as filesystem, commits, releases)

  Data Protection:
  - AeroVault encrypted containers (AES-256-GCM-SIV, Argon2id)
  - Master Password with auto-lock
  - Cryptomator vault support (format 8)
  - OS Keyring integration (libsecret / Keychain / Credential Manager)
  - Zero telemetry, all credentials stored locally

  AeroCloud, your Personal Cloud:
  Turn any FTP server into your private cloud with bidirectional sync
  and background service.

  Built-in Developer Suite:
  - Monaco Editor (VS Code engine) for remote file editing
  - Integrated terminal with theme sync
  - AeroAgent AI assistant (26 providers including OpenAI, Anthropic,
    Gemini, Ollama, and more)

  AeroSync, Reliable Synchronization:
  - Bidirectional sync with journal checkpoint and resume
  - Checksum verification and post-transfer validation
  - Configurable retry with exponential backoff

  More Features:
  - 8 app themes with day/night scheduling and configurable icon styles
  - Archive browser (ZIP, 7z, TAR, RAR) with selective extraction
  - AeroPlayer media player with 14 visualizers and 10-band EQ
  - Dual-pane browser with drag-and-drop and batch rename
  - Also includes a terminal-based client for advanced workflows
  - 47 languages supported

  Note: Snap version can access ~/home and removable media. For system-wide
  access, use .deb or .AppImage from GitHub releases.

  https://github.com/axpdev-lab/aeroftp/releases

  Built with Rust (Tauri 2) + React 18. GPL-3.0 license.

base: core22
grade: stable
confinement: strict
compression: lzo

contact: https://github.com/axpdev-lab/aeroftp/discussions
issues: https://github.com/axpdev-lab/aeroftp/issues
source-code: https://github.com/axpdev-lab/aeroftp
website: https://aeroftp.app
license: GPL-3.0-or-later

architectures:
  - build-on: amd64
    build-for: amd64

icon: icons/AeroFTP_simbol_color_512x512.png

plugs:
  # GPU userspace must match the host hardware/kernel.  Consume Canonical's
  # provider instead of shipping Mesa drivers in the application snap.
  graphics-core22:
    interface: content
    target: $SNAP/graphics
    default-provider: mesa-core22

# tauri-plugin-single-instance asks for this name on the session bus. Without the slot
# AppArmor denies it, every launch is a new instance and a second launch stays
# running with no window because the UI port is taken.
slots:
  single-instance:
    interface: dbus
    bus: session
    name: app.aeroftp.AeroFTP.SingleInstance

layout:
  /usr/share/libdrm:
    bind: $SNAP/graphics/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/graphics/drirc.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/graphics/X11/XErrorDB
  /usr/share/X11/locale:
    symlink: $SNAP/graphics/X11/locale

apps:
  aeroftp:
    command-chain:
      - bin/graphics-core22-wrapper
    command: usr/bin/aeroftp
    desktop: usr/share/applications/aeroftp.desktop
    # Keep the GTK/WebKit/OpenGL runtime wiring owned by Snapcraft.  Removing
    # this extension in 3bf266430 left GLVND with no EGL vendor inside strict
    # confinement and produced a blank WebKit window (issue #462).
    extensions:
      - gnome
    environment:
      # AeroFTP currently forces X11; the GNOME extension owns the remaining
      # desktop environment, including GTK_USE_PORTAL and the GL driver paths.
      GDK_BACKEND: x11
      # WEBKIT_DISABLE_COMPOSITING_MODE is deliberately not set here.  A strict
      # snap has to survive a software-only or remote X server, where EGL leaves
      # WebKit with a live white window, but pinning software compositing for
      # every user would also take the GPU away from the machines whose driver
      # works.  `linux_egl::configure_webkit_compositing` asks EGL at startup
      # and sets the variable only when the answer is no.
    plugs:
      - home
      - removable-media
      # The volume list and the mount watcher read /proc/mounts. snapd never
      # connects mount-observe on its own, so without
      # `snap connect aeroftp:mount-observe` the sidebar says how to connect
      # it instead of listing volumes (MOUNT_OBSERVE_NOT_CONNECTED).
      - mount-observe
      # Unmounted partitions, mount and eject go to the UDisks2 service over
      # D-Bus. snapd never connects this on its own either, so without
      # `snap connect aeroftp:udisks2` the sidebar says how to connect it
      # (UDISKS2_NOT_CONNECTED).
      - udisks2
      - network
      - network-bind
      # The UI loads from http://127.0.0.1, and inside a snap GLib asks the
      # desktop portal how to reach it (ProxyResolver). The portal answers a
      # snap only when it plugs network-status; without it the lookup fails
      # with "This call is not available inside the sandbox" and the window
      # shows that error instead of the app. Gate G5 checks it.
      - network-status
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - graphics-core22
      - audio-playback
      - unity7
      - gsettings

parts:
  aeroftp:
    plugin: nil
    source: .
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1
      - libacl1
      - librsvg2-2
      - libssl3
      - libasound2
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - iso-codes
      - libglu1-mesa
    override-build: |
      # Copy pre-built dispatcher layout
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/aeroftp
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      
      if [ -f src-tauri/target/release/aeroftp ]; then
        cp src-tauri/target/release/aeroftp $SNAPCRAFT_PART_INSTALL/usr/lib/aeroftp/aeroftp.bin
        chmod +x $SNAPCRAFT_PART_INSTALL/usr/lib/aeroftp/aeroftp.bin
        echo "GUI payload copied successfully"
      else
        echo "ERROR: GUI binary not found at src-tauri/target/release/aeroftp"
        ls -la src-tauri/target/release/ || echo "Release directory not found"
        exit 1
      fi

      if [ -f src-tauri/target/release/aeroftp-dispatch-bundle/aeroftp-cli ]; then
        cp src-tauri/target/release/aeroftp-dispatch-bundle/aeroftp-cli $SNAPCRAFT_PART_INSTALL/usr/lib/aeroftp/aeroftp-cli
        chmod +x $SNAPCRAFT_PART_INSTALL/usr/lib/aeroftp/aeroftp-cli
        echo "CLI payload copied successfully"
      else
        echo "ERROR: CLI binary not found at src-tauri/target/release/aeroftp-dispatch-bundle/aeroftp-cli"
        ls -la src-tauri/target/release/ || echo "Release directory not found"
        exit 1
      fi

      if [ -f src-tauri/target/release/aeroftp-dispatch-bundle/aeroftp-dispatch ]; then
        cp src-tauri/target/release/aeroftp-dispatch-bundle/aeroftp-dispatch $SNAPCRAFT_PART_INSTALL/usr/bin/aeroftp
        cp src-tauri/target/release/aeroftp-dispatch-bundle/aeroftp-dispatch $SNAPCRAFT_PART_INSTALL/usr/lib/aeroftp/aeroftp-dispatch
        chmod +x $SNAPCRAFT_PART_INSTALL/usr/bin/aeroftp
        chmod +x $SNAPCRAFT_PART_INSTALL/usr/lib/aeroftp/aeroftp-dispatch
        ln -sfn aeroftp $SNAPCRAFT_PART_INSTALL/usr/bin/aftp
        ln -sfn aeroftp $SNAPCRAFT_PART_INSTALL/usr/bin/aeroftp-cli
        echo "Dispatcher and aliases copied successfully"
      else
        echo "ERROR: dispatcher binary not found at src-tauri/target/release/aeroftp-dispatch-bundle/aeroftp-dispatch"
        ls -la src-tauri/target/release/ || echo "Release directory not found"
        exit 1
      fi
      
      # Copy icon
      cp icons/AeroFTP_simbol_color_512x512.png $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/aeroftp.png
      
      # Create desktop entry
      cat > $SNAPCRAFT_PART_INSTALL/usr/share/applications/aeroftp.desktop << 'DESKTOP'
      [Desktop Entry]
      Name=AeroFTP
      Comment=Multi-Protocol File Client with AI & Encryption (Snap - Limited FS)
      Exec=aeroftp %U
      Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/aeroftp.png
      Terminal=false
      Type=Application
      Categories=Network;FileTransfer;Development;
      Keywords=ftp;sftp;file;transfer;upload;download;
      MimeType=x-scheme-handler/ftp;x-scheme-handler/ftps;x-scheme-handler/sftp;application/x-aerovault;application/x-aeroftp;application/x-aeroftp-keystore;
      StartupWMClass=AeroFTP
      DESKTOP
      # Remove leading whitespace from desktop file
      sed -i 's/^      //' $SNAPCRAFT_PART_INSTALL/usr/share/applications/aeroftp.desktop

      # Install AeroFTP MIME type definitions (AeroVault, AeroFTP profile, AeroFTP keystore)
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/mime/packages
      cp com.aeroftp.AeroVault.xml $SNAPCRAFT_PART_INSTALL/usr/share/mime/packages/ || \
        { echo "ERROR: MIME XML not found"; exit 1; }

      # Install AeroFTP MIME type icons (8 PNG sizes + scalable SVG, 3 mime types)
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/mimetypes
      for icon in application-x-aerovault application-x-aeroftp application-x-aeroftp-keystore; do
        for size in 16 24 32 48 64 128 256 512; do
          mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/mimetypes
          cp src-tauri/icons/mimetypes/${icon}-${size}.png \
            $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/mimetypes/${icon}.png || \
            { echo "ERROR: Missing icon ${icon} ${size}px"; exit 1; }
        done
        cp src-tauri/icons/mimetypes/${icon}.svg \
          $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/mimetypes/${icon}.svg || \
            { echo "ERROR: Missing SVG icon ${icon}"; exit 1; }
      done

  # Canonical's maintained wrapper selects the provider's EGL/GL/DRI stack at
  # runtime.  Its cleanup removes duplicate GPU libraries pulled transitively
  # by GTK/WebKit, preventing the loader/driver ABI mix that broke swrast.
  graphics-core22:
    after:
      - aeroftp
    source: https://github.com/canonical/gpu-snap.git
    source-commit: d2b0948e6396ca0fe57da7748dadabbe06f6f7a4
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/graphics-core22-cleanup mesa-core22 nvidia-core22
    prime:
      - bin/graphics-core22-wrapper
