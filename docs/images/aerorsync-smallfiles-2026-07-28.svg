<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img">
<title>Twenty files of 256 KiB</title>
<rect width="100%" height="100%" fill="#f7f6f3"/>
<text x="64" y="32" font-family="Georgia, serif" font-size="20" fill="#1c1917">Twenty files of 256 KiB</text>
<text x="64" y="54" font-family="sans-serif" font-size="13" fill="#44403c">Seconds. Per-file sessions against one recursive rsync invocation. AeroRsync has no recursive scope in this build.</text>
<line x1="64" y1="368.0" x2="936" y2="368.0" stroke="#e7e5e4" stroke-width="1"/>
<text x="56" y="372.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#57534e">0</text>
<line x1="64" y1="295.5" x2="936" y2="295.5" stroke="#e7e5e4" stroke-width="1"/>
<text x="56" y="299.5" text-anchor="end" font-family="sans-serif" font-size="11" fill="#57534e">8</text>
<line x1="64" y1="223.0" x2="936" y2="223.0" stroke="#e7e5e4" stroke-width="1"/>
<text x="56" y="227.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#57534e">15</text>
<line x1="64" y1="150.5" x2="936" y2="150.5" stroke="#e7e5e4" stroke-width="1"/>
<text x="56" y="154.5" text-anchor="end" font-family="sans-serif" font-size="11" fill="#57534e">22</text>
<line x1="64" y1="78.0" x2="936" y2="78.0" stroke="#e7e5e4" stroke-width="1"/>
<text x="56" y="82.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#57534e">30</text>
<line x1="64" y1="78" x2="64" y2="368" stroke="#a8a29e"/>
<line x1="64" y1="368" x2="936" y2="368" stroke="#a8a29e"/>
<rect x="72.0" y="319.9" width="28.0" height="48.1" fill="#1d4e89" rx="2"/>
<text x="86.0" y="313.9" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c1917">4.981</text>
<rect x="104.0" y="123.9" width="28.0" height="244.1" fill="#a16207" rx="2"/>
<text x="118.0" y="117.9" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c1917">25.249</text>
<text x="104.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#292524">Per file</text>
<rect x="540.0" y="355.4" width="28.0" height="12.6" fill="#a16207" rx="2"/>
<text x="554.0" y="349.4" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1c1917">1.308</text>
<text x="540.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#292524">One recursive call</text>
<rect x="64" y="422" width="12" height="12" fill="#1d4e89"/>
<text x="82" y="432" font-family="sans-serif" font-size="12" fill="#292524">AeroRsync</text>
<rect x="182" y="422" width="12" height="12" fill="#a16207"/>
<text x="200" y="432" font-family="sans-serif" font-size="12" fill="#292524">rsync 3.2.7</text>
<text x="64" y="452" font-family="sans-serif" font-size="11" fill="#57534e">The recursive bar is rsync only. That gap is scope, not a timing of the same call.</text>
</svg>
