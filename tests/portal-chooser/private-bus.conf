<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A private session bus that KEEPS the standard service directories, so gvfs, the
  keyring and everything else the app might legitimately want stays activatable.
  A bus with nothing activatable models "no portal" but also breaks half the
  desktop, and then a chooser that fails to appear could be blamed on the missing
  portal when something else broke it.

  Activation is therefore ON here. The stand-in claims
  org.freedesktop.portal.Desktop before the app starts, so the real
  xdg-desktop-portal is never the one that answers in the default cases.

  The "no portal installed" case must NOT use this file as it stands.
  recon-session.sh rewrites <standard_session_servicedirs/> below into a private
  <servicedir> built by make-servicedir-without-portal.sh, and verifies that the
  rewrite took. Without that step the REAL xdg-desktop-portal is activated on
  demand the moment nothing owns the name, which silently turns "no portal
  installed" into "the real portal, on a private bus". Measured: with the
  stand-in absent, xdg-desktop-portal-gtk appeared and was caught by the a11y
  assertion.

  Keep the element on its own line and spelled exactly as it is: that rewrite
  matches it literally.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
