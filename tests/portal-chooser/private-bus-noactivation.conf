<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A session bus with NO <servicedir>, so nothing on it can be D-Bus activated.

  This is not belt-and-braces, it is required for correctness. `dbus-run-session`
  inherits the system service directories, so the moment the harness did NOT own
  org.freedesktop.portal.Desktop, the REAL xdg-desktop-portal was activated on
  demand and answered instead - which silently turns the "no portal installed"
  scenario into "the real portal, on a private bus". Measured: with the stand-in
  absent, xdg-desktop-portal-gtk appeared and was caught by the a11y assertion.

  Everything the harness needs owns its name explicitly (the stand-in, and
  at-spi-bus-launcher), so nothing here relies on activation.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
