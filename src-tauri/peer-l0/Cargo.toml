[package]
name = "aeroftp-peer-l0"
version = "0.0.1-spike"
edition = "2021"
rust-version = "1.85.0"
publish = false
description = "AeroFTP Peer L0 spike — isolated iroh transport experiment (T-PEER)"
license = "GPL-3.0-or-later"

# Own workspace root: keeps this spike crate out of any parent workspace (its
# Cargo.lock stays authoritative for standalone builds, and a future
# `--workspace` lint/test invocation in src-tauri cannot pull this crate in).
# NOTE it does NOT shield from `cargo fmt --all`: cargo-fmt formats local
# path dependencies regardless of workspace boundaries (verified WI-3b on
# both machines), so from the moment the app gains a path dep on this crate
# (WI-3c) this crate must STAY rustfmt-clean. It is, since WI-3b.
[workspace]

[[bin]]
name = "peer-l0-dial"
path = "src/main.rs"

[dependencies]
# Historical isolation premise: pull recent iroh without fighting the app's
# russh aead pin. WI-3a (2026-06-10) DISPROVED the conflict: russh 0.60.3 sits
# on the RC crypto lineage via its forked ssh-key, iroh on the stable one, and
# both already coexist in the app graph (cargo check green with iroh added).
# The crate stays isolated for sequencing/lint reasons, not dependency ones;
# convergence is planned as WI-3c (path dep + audit ruling on iroh's graph).
# Mainline-DHT discovery (WI-5a): the endpoint resolves/publishes node records on the
# BitTorrent DHT alongside (or instead of) n0's DNS. Decentralized discovery = the A+
# independence move. iroh 1.0 dropped the `discovery-pkarr-dht` cargo feature; the DHT
# backend now lives in the `pkarr` crate and is wired in via `Builder::add_discovery`
# (see endpoint.rs `apply_discovery`). The iroh 0.92 -> 1.0 bump clears the 6 Dependabot
# advisories that iroh 0.92 pinned via hickory-proto (x4) and lru (x2).
iroh = "1.0"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = "0.101"
# Mainline-DHT address lookup: iroh 1.0 moved the pkarr Mainline-DHT backend out of the
# `discovery-pkarr-dht` cargo feature into this companion crate. It provides the DHT
# publisher + resolver that `apply_discovery` adds via `Builder::address_lookup` for the
# `Dht`/`Both` modes (n0 DNS stays via iroh's built-in PkarrPublisher/DnsAddressLookup).
iroh-mainline-address-lookup = "0.4"
# LAN (mDNS) address lookup: iroh 1.0's mDNS backend lives in this companion crate
# (`MdnsAddressLookup`, swarm-discovery based). `apply_discovery` adds it via
# `Builder::address_lookup` for the `Lan` (mDNS only, fully offline) and `Both` modes, so
# two devices on the same subnet find each other with zero internet and zero relay.
iroh-mdns-address-lookup = "0.4"
blake3 = "1"
bytes = "1"
futures-lite = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

# Encryption for L0 "vault-encrypted" blob (stand-in until full integration with main user_crypto).
# These are isolated to this spike crate.
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# WI-4a peer identity: Ed25519 user-identity signing + X25519 sealed capabilities. Both sit on the
# STABLE dalek lineage already in this crate's graph (iroh 0.92 -> curve25519-dalek 4.x), so they add
# no new crypto lineage. Used by src/identity.rs (storage-agnostic; the vault facade is WI-4b).
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
