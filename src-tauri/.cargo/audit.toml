[advisories]
ignore = [
    # ----------------------------------------------------------------
    # RUSTSEC-2023-0071 - Marvin Attack on RSA decryption
    # ----------------------------------------------------------------
    # Marvin is a timing side-channel observable when an attacker can request
    # repeated RSA *decrypt* operations and measure response time. AeroFTP's
    # two transitive paths to the `rsa` crate never expose a decrypt oracle:
    #
    #   Path A (rsa 0.9.10):
    #     rsa <- openidconnect 4.0.1 <- sigstore 0.14.0 <- aeroftp
    #   Used by `verify_sigstore_bundle` in src-tauri/src/lib.rs to verify
    #   GitHub Actions Sigstore bundles attached to release artifacts.
    #   Fulcio signs short-lived certificates with ECDSA P-256, not RSA.
    #   The `rsa` crate is dormant in this call graph.
    #   Verification path is also explicitly NON-BLOCKING (see lib.rs ~2300):
    #   any verification error degrades to `VerificationMode::Unavailable`
    #   instead of refusing the update; SHA-256 of the artifact is the
    #   primary integrity check.
    #
    #   Path B (rsa 0.10.0-rc.16):
    #     rsa <- internal-russh-forked-ssh-key 0.6.18 <- russh 0.60.3 <- aeroftp
    #   Used to parse user SSH private keys (id_rsa, etc.) and sign SSH auth
    #   challenges in providers/sftp.rs and aerorsync/russh_session_transport.rs.
    #   AeroFTP only ever SIGNS with the user's RSA private key (RFC 4252 +
    #   RFC 8332 client publickey auth flow); the server VERIFIES. We never
    #   decrypt RSA ciphertext. The Marvin precondition (attacker-observable
    #   RSA decrypt) is not reachable through our SSH client surface.
    #
    # Both paths await upstream resolution (see APPENDIX-RUSSH and the
    # planned APPENDIX-SIGSTORE for the deferred decommission playbooks).
    # russh `main` has introduced a `rsa` feature flag that will allow
    # opt-out, but it has not landed in a published release as of 2026-05-06.
    # `rsa 0.10` itself is still RC since 2023.
    "RUSTSEC-2023-0071",

    # ----------------------------------------------------------------
    # proc-macro-error unmaintained (transitive via Tauri / tray-icon)
    # ----------------------------------------------------------------
    # `proc-macro-error 1.0.4` <- `glib-macros 0.18.5` <- `glib 0.18.5` <-
    # `gtk 0.18.2` <- `tray-icon 0.21.3` <- `tauri 2.10.3`. Same gtk-rs
    # paused-bindings situation. Will clear when Tauri ships GTK4 wry.
    "RUSTSEC-2024-0370",  # proc-macro-error

    # ----------------------------------------------------------------
    # unic-* unmaintained (runtime, via tauri-utils / urlpattern)
    # ----------------------------------------------------------------
    # `unic-char-property`, `unic-char-range`, `unic-common`, `unic-ucd-ident`,
    # `unic-ucd-version` are all pulled by `urlpattern 0.3.0` <- `tauri-utils`
    # 2.9 <- `tauri` 2.11.0 <- aeroftp. They ARE in the shipped binary:
    # tauri-utils parses capability `remote` URLs with urlpattern
    # (`acl::RemoteUrlPattern`), at build time in tauri-build and at runtime
    # in `tauri`. Unmaintained is the whole advisory (no vulnerability), and
    # the inputs are our own capability files, not remote data. tauri-utils
    # stays on 2.9 with the `tauri` =2.11.0 pin (see Cargo.toml); 2.10 moves
    # to urlpattern 0.6, which drops unic-*, so these clear with that move.
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident

    # ----------------------------------------------------------------
    # glib 0.18 unsound (transitive via Tauri / wry)
    # ----------------------------------------------------------------
    # `glib 0.18.5` carries a soundness advisory for `glib::VariantStrIter`:
    # its iterator passed an immutable reference to a C out-parameter.
    # AeroFTP never calls `VariantStrIter`. glib comes with the GTK3 stack
    # of the Tauri 2.x Linux WebView (wry, WebKitGTK). Cannot be dropped
    # without dropping Tauri Linux support entirely. Will be cleared
    # automatically when Tauri ships GTK4-based wry.
    "RUSTSEC-2024-0429",  # glib

    # ----------------------------------------------------------------
    # Tauri 2.11.0 Origin Confusion (Windows/Android only) - intentional pin
    # ----------------------------------------------------------------
    # GHSA-7gmj-67g7-phm9 / CVE-2026-42184 (CVSS:4.0/AV:N/VI:H) flags Tauri's
    # `is_local_url()` for accepting `http://<scheme>.attacker.com/` as a
    # local origin on Windows and Android, because the check only inspects
    # the first dot-separated label of the host. An attacker who entices a
    # user to load such a page can invoke backend IPC commands that the
    # developer intended to be reachable only from the bundled frontend.
    #
    # AeroFTP is NOT reachable through this vector:
    #
    #   1. The localhost server is a LINUX arrangement, and saying so makes
    #      this ignore stronger rather than weaker. Each of the three windows
    #      is built from a cfg triple, and the shipped arms are:
    #
    #        prod + linux      -> WebviewUrl::External("http://127.0.0.1:<port>/...")
    #        prod + not linux  -> WebviewUrl::App(...)      i.e. the tauri:// protocol
    #
    #      So on Windows and macOS the app never loads an External URL in a
    #      shipped build at all, and the origin this advisory abuses has no
    #      entry point there. On Linux it does load one, from the bundled
    #      `ui_server` loopback server (formerly tauri-plugin-localhost, same
    #      origin), and Linux is not in the affected
    #      platform set. Two legs, one per platform, both stated.
    #
    #      `WebviewUrl::External` IS used, and an earlier version of this note
    #      wrongly said it was not. Its replacement said "four places", which
    #      was true and still misleading twice over: it did not say on which
    #      platform, and it counted a DEV-only site (the splash on the Vite
    #      server at :5173) alongside three that ship. Shipped it is three, on
    #      Linux: index, splash, extract. Every one parses a fixed
    #      `http://127.0.0.1:<port>/` URL built in our own code; none takes a
    #      URL from a server, a profile, a file or any other outside input,
    #      and there is no `loadUrl` accepting attacker input.
    #
    #      The property that matters for this advisory is that no
    #      attacker-chosen URL reaches a webview. That holds on every platform.
    #      The absolute claim did not, and the unqualified count offered a
    #      Linux fact as grounds for judging a Windows risk.
    #   2. On Linux the webview origin is `http://127.0.0.1:*`, and on Windows
    #      and macOS it is the `tauri://` App protocol. Neither is a custom
    #      scheme mapped via `http://<scheme>.localhost/`, so the buggy
    #      first-dot check does not apply to our origin shape on any platform.
    #   3. Linux/macOS builds are not in the affected platform set at all.
    #
    # Why we cannot simply take the fix, stated correctly. 2.11.1 did NOT
    # introduce a stricter `is_local_url()` that classifies
    # `http://127.0.0.1:*` as remote; an earlier version of this note said so
    # and it is wrong. Diffing the two published crates, the only edit to that
    # function is inside `#[cfg(any(windows, target_os = "android"))]`, and
    # neither version compares the host to 127.0.0.1 at all. The function
    # already answered false for our origin under 2.11.0, because in
    # production `get_app_url()` falls back to `tauri://localhost` whenever
    # `frontendDist` is a directory, as ours is. What 2.11.1 changed is the
    # IPC gate, which now enforces that answer on app commands as well:
    # `if (plugin_command.is_some() || has_app_acl_manifest || !is_local)`.
    #
    # The distinction is not academic. Under the old wording the fix looked
    # like it could be met by changing the webview origin; it cannot. The only
    # lever that makes `get_app_url()` return our HTTP URL is declaring
    # `frontendDist` as a URL, and tauri-codegen maps `FrontendDist::Url` to an
    # EMPTY embedded asset set, which is precisely what `ui_server` serves.
    # The remedy erases the content the server exists to serve.
    #
    # So migrating to 2.11.1 means giving all 1013 commands in the invoke
    # handler an ACL. There is no `src-tauri/permissions/` today, so
    # `has_app_manifest()` is false and they bypass ACL; adding one app
    # permission flips it true and then ACL governs every command. The
    # capability's `remote` block already lists `http://127.0.0.1:14321/*`, so
    # that is not the missing piece. Tracked separately, and unrelated to this
    # CVE's attack surface.
    #
    # The matching pin rationale lives inline on the `tauri` dependency in
    # src-tauri/Cargo.toml (line numbers drift, search for "DO NOT BUMP").
    "GHSA-7gmj-67g7-phm9",  # Tauri Origin Confusion (not reachable, intentional pin)

    # ----------------------------------------------------------------
    # russh advisories CLEARED by the 0.61.2 bump (no longer ignored)
    # ----------------------------------------------------------------
    # GHSA-wwx6-x28x-8259 (HIGH, post-decompression packet size) and
    # GHSA-hpv4-5h6f-wqr3 (MEDIUM, server userauth reset), plus the message
    # field / banner / keyboard-interactive parsing advisories, are all fixed
    # in russh 0.61.x. We bumped `russh = "0.61.2"` (Cargo.toml:142) once the
    # 0.61.0/0.61.1 upstream RC-crypto packaging conflict was resolved at
    # 0.61.2 (see reference-russh-061-unbuildable in memory). No russh advisory
    # is ignored anymore; the entries were removed in the v4.0.5 cycle.

    # ----------------------------------------------------------------
    # instant 0.1.13 unmaintained (transitive via the AeroVault v4 ECC wrapper)
    # ----------------------------------------------------------------
    # RUSTSEC-2024-0384. `instant` is unmaintained (superseded by `web-time`).
    # It enters the tree ONLY through the optional ECC error-correction wrapper:
    #   instant 0.1.13 <- parking_lot 0.11.2 <- reed-solomon-erasure 6.0.0 <- aeroftp
    # `reed-solomon-erasure 6.0.0` pins `parking_lot = "^0.11.2"`, which cannot
    # resolve to parking_lot 0.12 (the release that dropped `instant`), so the
    # advisory is not locally fixable without forking the RS crate.
    #
    # No security surface: `instant` is a monotonic-clock shim. On AeroFTP's
    # native desktop targets (Linux/macOS/Windows; never wasm) it compiles to a
    # thin wrapper over std::time::Instant; the wasm-specific path that carries
    # any concern is never built. parking_lot uses it only for internal
    # lock-elapsed bookkeeping, reached exclusively from reed-solomon-erasure's
    # in-memory parity compute/reconstruct on ECC-enabled vaults. No untrusted
    # input, no parsing and no crypto decision flows through it.
    #
    # Exit path: move to a maintained RS crate (reed-solomon-simd /
    # reed-solomon-novelpoly) or wait for reed-solomon-erasure to bump parking_lot.
    # Full evaluation: docs/security-evidence/REED-SOLOMON-ERASURE-EVALUATION-2026-06.md.
    "RUSTSEC-2024-0384",  # instant unmaintained (ECC wrapper via parking_lot 0.11)

    # ----------------------------------------------------------------
    # lru 0.7.8 pop panic-safety (transitive via reed-solomon-erasure 6.0.0)
    # ----------------------------------------------------------------
    # RUSTSEC-2026-0253. Older lru releases can leave a dangling list node only
    # when ALL of these conditions hold: pop() removes a stored key whose Drop
    # implementation panics, unwinding is enabled, and the panic is caught so a
    # later cache operation can touch the damaged list. The upgradeable lru
    # 0.18.0 instance was bumped to fixed 0.18.2; only this 0.7.8 instance remains:
    #   lru 0.7.8 <- reed-solomon-erasure 6.0.0 <- aeroftp / aerovault
    # reed-solomon-erasure fixes the cache key to Vec<usize>
    # (`data_decode_matrix_cache` in core.rs). Vec<usize> has no user code and
    # its Drop cannot panic, so the first advisory precondition is unreachable.
    # AeroFTP cannot supply a custom key type to this private internal cache.
    #
    # No compatible patched 0.7.x release exists; the advisory marks only
    # lru >= 0.18.2 patched, while reed-solomon-erasure 6.0.0 requires lru 0.7.
    # Exit path: remove this ignore when reed-solomon-erasure updates its lru
    # dependency, or when AeroFTP replaces that crate as already tracked by the
    # Reed-Solomon evaluation cited above.
    "RUSTSEC-2026-0253",  # lru 0.7.8; fixed non-panicking Vec<usize> cache key

    # ----------------------------------------------------------------
    # iroh 1.0 P2P stack - two transitive UNMAINTAINED advisories (peer-l0 normal dependency)
    # ----------------------------------------------------------------
    # The user-to-user P2P drive (T-PEER / AeroShare) links the isolated
    # `aeroftp-peer-l0` crate as a NORMAL dependency (path = "peer-l0"); WI-3d
    # promoted it from [dev-dependencies] so the iroh drive engine ships in the
    # binary (the app drives it via src/peer/). peer-l0 remains the iroh isolation
    # boundary. It now pulls iroh 1.0 + iroh-blobs 0.103 + iroh-docs 0.101 +
    # iroh-gossip 0.101 (the 0.92 -> 1.0 migration, 2026-06-26).
    #
    # The migration CLEARED the three vulnerability/unsound advisories the 0.92 line
    # pinned (this is the exit path the earlier evidence doc anticipated):
    #   - RUSTSEC-2026-0118 + RUSTSEC-2026-0119 (hickory-proto DoS): iroh 1.0 resolves
    #     to hickory-proto 0.26.1, which carries both fixes (NSEC3 loop + O(n^2) encode).
    #   - RUSTSEC-2026-0002 (lru IterMut unsound): iroh 1.0's relay stack uses lru
    #     0.18.0 (patched, >= 0.16.3); the only other lru in the graph is 0.7.8 (via
    #     reed-solomon-erasure), which the advisory marks unaffected (< 0.9.0). The
    #     vulnerable lru 0.13.0 and the pkarr crate are gone from the graph entirely.
    # iroh 1.0 also dropped stun-rs and pkarr (the Mainline DHT moved to the separate
    # `iroh-mainline-address-lookup` crate). Full record + per-advisory reachability:
    # docs/security-evidence/IROH-PEER-L0-ADVISORIES-2026-06.md.
    #
    # Only two UNMAINTAINED advisories (NOT vulnerabilities) remain in iroh 1.0's
    # graph, both compile-time / shim crates with no runtime exploitation surface:
    #
    #   RUSTSEC-2023-0089 (atomic-polyfill, unmaintained) - an atomics shim reached
    #     via heapless 0.7 <- postcard <- iroh-blobs / iroh-docs <- peer-l0. Not a
    #     vulnerability; a transitive build-block superseded upstream by
    #     `portable-atomic`. (Behind a target-conditional heapless feature, so it
    #     shows only under `cargo tree --target all`, but is in the lock audit reads.)
    "RUSTSEC-2023-0089",  # atomic-polyfill unmaintained (heapless/postcard transitive)

    #   RUSTSEC-2024-0436 (paste, unmaintained) - a compile-time proc-macro reached
    #     in iroh 1.0 via netlink-packet-core <- netdev <- netwatch <- iroh (the old
    #     stun-rs path is gone in 1.0). No runtime surface (proc-macro, build-time
    #     only); superseded by `pastey`. Not a vulnerability.
    "RUSTSEC-2024-0436",  # paste unmaintained (compile-time proc-macro, netwatch path)

    # ----------------------------------------------------------------
    # zvariant / zbus_names / zvariant_derive unmaintained (folded into zbus 6)
    # ----------------------------------------------------------------
    # RUSTSEC-2026-0370 (zvariant), RUSTSEC-2026-0371 (zbus_names) and
    # RUSTSEC-2026-0372 (zvariant_derive), published 2026-10-16. UNMAINTAINED,
    # not vulnerabilities: upstream stopped publishing the three as standalone
    # crates because zbus 6.0.0 (released the same day) absorbs them as its
    # `wire` and `names` modules and its own derive macros (z-galaxy/zbus#2043).
    # No release of the three is marked patched, so every zbus 4.x and 5.x
    # graph carries them. Two instances of each sit in Cargo.lock:
    #
    #   zbus 5 line (zvariant 5.15.0, zvariant_derive 5.15.0, zbus_names 4.3.4):
    #     zbus 5.19.0 <- tauri-plugin-single-instance 2.4.5 <- aeroftp
    #     zbus 5.19.0 <- notify-rust 4.18.0 <- tauri-plugin-notification 2.4.0 <- aeroftp
    #   Compiled into the Linux binary only (both edges are cfg(linux) /
    #   cfg(unix, not macOS)). The D-Bus client the single-instance handoff and
    #   desktop notifications use, talking to the user's own session bus. It
    #   never sees network data.
    #
    #   zbus 4 line (zvariant 4.2.0, zvariant_derive 4.2.0, zbus_names 3.0.0):
    #     zbus 4.4.0 <- secret-service 4.0.0 <- keyring 3.6.3 <- aeroftp
    #   Present in Cargo.lock but compiled on NO target. keyring's
    #   `sync-secret-service` feature (the one we enable) uses dbus-secret-service
    #   over libdbus; secret-service/zbus are its optional `async-secret-service`
    #   path, which Cargo.lock lists although nothing activates it
    #   (`cargo tree --target all -i zbus@4.4.0` prints nothing).
    #
    # Why no upgrade clears them, measured 2026-10-17 against crates.io and with
    # targeted `cargo update -p` on each crate above: the newest notify-rust
    # (4.18.2), tauri-plugin-notification (2.7.0), tauri-plugin-single-instance
    # (2.5.4), their 3.0.0-alpha.3 lines and secret-service 5.2.0 all still
    # require zbus ^5. The plugin releases past 2.4.x also require tauri ^2.12,
    # which the tauri =2.11.0 pin and the runtime layer hold (Cargo.toml) rule
    # out, so `cargo update -p` leaves both plugins where they are. keyring 4
    # would not help either: its zbus-secret-service-keyring-store 1.0.1 store
    # needs zbus ^5.
    #
    # Exit path: the zbus 5 line leaves when tauri-plugin-single-instance and
    # notify-rust publish on zbus 6 and we can take them (for single-instance
    # that means the tauri pin migration, unless a 2.4.x release moves); the
    # zbus 4 line leaves when keyring (or its optional zbus store) moves to
    # zbus 6. Each ID covers both lines, so the three ignores are removed
    # together once neither line is left in Cargo.lock.
    "RUSTSEC-2026-0370",  # zvariant unmaintained (merged into zbus 6; zbus 5 Linux-only D-Bus client, zbus 4 lock-only)
    "RUSTSEC-2026-0371",  # zbus_names unmaintained (merged into zbus 6; same two paths)
    "RUSTSEC-2026-0372",  # zvariant_derive unmaintained (merged into zbus 6; same two paths)
    # ----------------------------------------------------------------
    # RUSTSEC-2026-0387 - crypto-bigint timing variability (0.5.5 copy only)
    # ----------------------------------------------------------------
    # The advisory: subtraction, zero counting, division and Montgomery
    # multiplication could take secret-dependent branches, depending on the
    # compiler and target CPU, so code running them on secret integers may leak
    # through timing or microarchitectural side channels. Fixed in 0.7.6.
    #
    # The 0.7 line is bumped to 0.7.6 in Cargo.lock (russh, rsa, ssh-key,
    # elliptic-curve 0.14), so this ID now matches only crypto-bigint 0.5.5:
    #   - proton-srp 0.8.4 <- proton-crypto <- proton-crypto-account: the SRP
    #     proof of the Proton Drive sign-in, computed on the user's machine
    #     from the password-derived exponent. The secret-dependent work is a
    #     handful of modular exponentiations per sign-in.
    #   - elliptic-curve 0.13 and cx448 0.1.1 <- pgp 0.21 <- proton-rpgp:
    #     Proton's end-to-end key operations (decrypting node keys, signing
    #     uploads) on the user's machine.
    #   - elliptic-curve 0.13 <- p256/p384 0.13 <- openidconnect 4.0.1 <-
    #     sigstore 0.14: update signature verification, public inputs only, no
    #     secret ever reaches it.
    # Exposure: the two secret paths run locally, once per operation, on the
    # user's own machine. Exploiting them needs an attacker who can measure
    # those computations closely (co-resident code on the same CPU, or many
    # precisely timed sign-ins observed from the network); such an attacker
    # already sits beside the decrypted files. The verification path handles
    # no secret.
    #
    # Why no upgrade clears it, measured 2026-10-24 against crates.io:
    # proton-srp 0.8.4, pgp 0.21.0, cx448 0.1.1 and openidconnect 4.0.1 are
    # the latest releases and all require the 0.13 elliptic-curve / 0.5
    # crypto-bigint stack; there is no patched 0.5 release.
    #
    # Exit path: remove this ignore when proton-srp, pgp (through the vendored
    # proton-rpgp) and openidconnect move to elliptic-curve 0.14 /
    # crypto-bigint >= 0.7.6, i.e. when `cargo tree -i crypto-bigint@0.5.5`
    # prints nothing.
    "RUSTSEC-2026-0387",  # crypto-bigint timing variability (0.7 bumped to 0.7.6; 0.5.5 copy via proton-srp, pgp, openidconnect, no patched 0.5)
    # ----------------------------------------------------------------
    # RUSTSEC-2026-0459 - libsqlite3-sys via C SQLite CVE-2026-119375
    # ----------------------------------------------------------------
    # SQLite versions before 3.54.0 can return uninitialized page-cache
    # memory when a process opens a database file together with a sibling
    # write-ahead-log (-wal) file whose page size differs from the database's.
    # The attack vector is local and requires opening crafted database files.
    #
    # Path: libsqlite3-sys 0.30.1 <- rusqlite 0.32.1 <- aeroftp 4.2.7 (and dev-deps).
    #
    # Exposure in AeroFTP: rusqlite is used across three controlled categories:
    #   1. App-owned local state databases:
    #      - user_partitions.db
    #      - MCP client tables (mcp_client_config.rs, mcp_client_oauth.rs, mcp_client_http_config.rs)
    #      - file_tags.db (file_tags.rs)
    #      - agent_memory.db and chat_history.db (lib.rs, chat_history.rs)
    #      - S3 delta sync baseline cache (s3_delta_baseline.rs)
    #      - CLI jobs tracking (aeroftp_cli.rs jobs.db)
    #      All of these files reside strictly within the user's private local
    #      application/config/portable directory. Planting a crafted -wal file
    #      here already requires local user execution privileges.
    #   2. Flatpak host-config migration (portable.rs copy_missing_node):
    #      Opens the user's existing host configuration databases in
    #      SQLITE_OPEN_READ_ONLY strictly from the user's owned host config
    #      directory (~/.config/aeroftp, resolved by default_host_config_dir(),
    #      not an arbitrary path) to create clean snapshots via `VACUUM main INTO`.
    #      Any sibling -wal belongs to the same local user context.
    #   3. Encrypted keystore backup preview and restore (keystore_export.rs):
    #      During preview (open_backup_partition) and prepare_partition_restore,
    #      the AES-GCM authenticated database bytes are materialised strictly
    #      as a single file (user_partitions.db) in an isolated private
    #      tempfile::tempdir() (mode 0700) without any sibling -wal or -shm file
    #      (the SQLITE_DBS whitelist only admits known .db names and the backup
    #      archive never transports WAL sidecars). Because CVE-2026-119375
    #      requires opening a database together with a mismatched sibling -wal,
    #      opening an isolated .db file without a sibling -wal cannot trigger the
    #      vulnerability. During final publication (keystore_export.rs:2231-2232),
    #      any pre-existing -wal and -shm files in config_dir are removed before
    #      the restored database is reopened.
    #
    # Upgrade blocker: patched libsqlite3-sys >= 0.39.0 bundles SQLite >= 3.54.0,
    # which is only available starting with rusqlite 0.41.0 (a breaking semver
    # bump from 0.32 with Rust 1.89+ MSRV and API revisions).
    #
    # Exit path: remove this ignore when AeroFTP bumps to rusqlite >= 0.41.0.
    "RUSTSEC-2026-0459",  # libsqlite3-sys via C SQLite CVE-2026-119375 (isolated app DBs and no-WAL backup flow; upgrade needs rusqlite 0.41+ and Rust 1.89)
]

# We do NOT ignore "informational" advisories blanket-style. Each ignore is
# a specific RUSTSEC ID with a paragraph explaining the threat-model gap.
# Severity: do not blanket-ignore "low" or "informational"; review them.

[output]
deny = ["unmaintained", "unsound", "yanked"]
quiet = false
# `vulnerability` is implicitly always denied (advisories[ignore] is the only
# escape hatch and every ignored ID is justified above).
