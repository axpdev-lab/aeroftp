# Vendored from crates.io `proton-rpgp` 0.9.0 (the published, normalized
# manifest) with AeroFTP's patch: `pqc` is an opt-in feature here instead of
# always on. Integration test targets are dropped with the tests themselves.
# Provenance, the full change list and the removal condition: AEROFTP-PATCH.md.

[package]
edition = "2021"
name = "proton-rpgp"
version = "0.9.0"
authors = ["Proton AG"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure Rust OpenPGP wrapper on top of rpgp; used as an optional backend in proton-crypto"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/ProtonMail/proton-crypto-rs"

[features]
default = []
hazmat-key-gen = []
# AeroFTP patch: post-quantum algorithms (ML-KEM, ML-DSA, SLH-DSA) are opt-in.
# Upstream always enables `pgp/pqc`, whose `ml-kem` 0.2 pins `kem` 0.3.0-pre.0
# and cannot resolve next to russh's `ml-kem` 0.3. See AEROFTP-PATCH.md.
pqc = ["pgp/pqc", "dep:kem"]

[lib]
name = "proton_rpgp"
path = "src/lib.rs"











[dependencies.hex]
version = "0.4.3"

[dependencies.kem]
version = "=0.3.0-pre.0"
optional = true

[dependencies.nom]
version = "8.0"

[dependencies.pgp]
version = "0.21.0"
features = [
    "malformed-artifact-compat",
    "draft-wussler-openpgp-forwarding",
    "large-rsa",
]
default-features = false

[dependencies.rand]
version = "0.8.5"

[dependencies.rsa]
version = "0.9.10"

[dependencies.sha2]
version = "0.10.9"
features = ["oid"]

[dependencies.smallvec]
version = "1.10.0"

[dependencies.thiserror]
version = "1"

[dependencies.web-time]
version = "1.1.0"

[dependencies.x25519-dalek]
version = "2.0.1"
default-features = false

[dependencies.zeroize]
version = "1.8.0"
features = ["zeroize_derive"]

[target.'cfg(target_arch = "wasm32")'.dependencies.pgp]
version = "0.21.0"
features = [
    "malformed-artifact-compat",
    "draft-wussler-openpgp-forwarding",
    "large-rsa",
    "wasm",
]
default-features = false

[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
index_refutable_slice = "warn"
indexing_slicing = "warn"
mut_mut = "warn"
print_stdout = "warn"
string_slice = "warn"
unseparated_literal_suffix = "warn"
wrong_self_convention = "warn"

[lints.clippy.missing-errors-doc]
level = "allow"
priority = 1

[lints.clippy.must-use-candidate]
level = "allow"
priority = 1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.return-self-not-must-use]
level = "allow"
priority = 1

[lints.clippy.similar-names]
level = "allow"
priority = 1

[lints.rust]
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(forcego)"]
