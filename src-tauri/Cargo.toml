[package]
name = "aeroftp"
version = "4.0.5"
description = "AeroFTP - Fast, Beautiful, Reliable FTP Client"
authors = ["axpdev"]
license = "GPL-3.0"
repository = "https://github.com/axpdev-lab/aeroftp"
edition = "2021"
rust-version = "1.85.0"
default-run = "aeroftp"

[lib]
name = "ftp_client_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aeroftp-cli"
path = "src/bin/aeroftp_cli.rs"

[[bin]]
name = "aeroftp-dispatch"
path = "src/bin/aeroftp_dispatch.rs"

[[bin]]
name = "aerorsync_serve"
path = "src/bin/aerorsync_serve.rs"
# The real server body is gated behind the `aerorsync` feature. When the
# feature is OFF this binary compiles to a stub that prints a message and
# exits with code 1, so the Tauri bundler can still copy the expected
# artifact on macOS and Windows without failing the release build.
# (This dev helper is the wire-protocol oracle used by unit and live tests;
# the production path talks to stock `rsync --server` via `WrapperParity`.)

[[bin]]
name = "seed_test_profiles"
path = "src/bin/seed_test_profiles.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filetime = "0.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
log = "0.4"
futures-util = "0.3"
# DO NOT BUMP. Dependabot raised this to =2.11.1 (PR #201) and broke EVERY
# Linux build: 2.11.1's GHSA-7gmj-67g7-phm9 fix added an `is_local_url()`
# check that classifies the Linux production webview origin
# `http://127.0.0.1:14321` as remote and rejects every custom command
# ("not allowed by ACL": get_local_files, vault read, keystore, mount,
# update) because default.json is not a full app ACL manifest. Windows/macOS
# use the `tauri://` App protocol and are unaffected, which is why only
# Linux regressed. The webview origin must stay on the localhost server so
# upgrades preserve all WebKit origin-scoped state (localStorage, IndexedDB,
# server filters, theme, etc.). The CVE vector requires loading
# remote/untrusted content, which AeroFTP does not do, so the residual risk
# is not applicable to our surface. Keep =2.11.0; ignore tauri 2.11.x in
# dependabot.yml.
tauri = { version = "=2.11.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
suppaftp = { version = "=8.0.3", features = ["tokio", "tokio-rustls-aws-lc-rs", "deprecated"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "1.0"
rustls-native-certs = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
portable-pty = "0.9"
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
notify = { version = "8", default-features = true }                          # Filesystem watcher (v8 required by debouncer-full 0.6)
notify-debouncer-full = "0.6"                                               # Debouncer with rename tracking, event dedup, quiet-period batching
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2"                                               # Launch on system startup
tauri-plugin-window-state = "2"

# Multi-protocol providers (Sprint 1)
async-trait = "0.1"
regex = "1"
url = "2"
urlencoding = "2"
percent-encoding = "2"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
md-5 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
walkdir = "2"
quick-xml = "0.40"

# OAuth2 Cloud Providers (Sprint 2)
oauth2 = { version = "5", default-features = false }
http = "1"
open = "5"
rand = "0.8"
# rand 0.10 alias used only by `aeroftp-cli serve sftp` to feed russh 0.60's
# new CryptoRng bound on `PrivateKey::random()`. The rest of the codebase
# stays on rand 0.8 to avoid an ecosystem-wide bump.
rand_010 = { package = "rand", version = "0.10" }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2.3.3"
semver = "1.0.28"
sigstore = { version = "0.13", default-features = false, features = ["bundle", "sigstore-trust-root", "native-tls"] }

# Secure Credential Storage (v1.3.2 hotfix)
argon2 = "0.5"
aes-gcm = "0.10"
aes = "0.8"                                                            # AES block cipher (Internxt)
cbc = "0.1"                                                            # AES-CBC mode (Internxt mnemonic decryption)
ctr = "0.9"                                                            # AES-CTR mode (Internxt file encryption)
crypto_secretbox = "0.1"                                               # XSalsa20-Poly1305 NaCl secretbox (rclone crypt)

# MEGA Integration (Quick Connect Beta v0.5.0)
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
ring = "0.17.14"

# Box, pCloud, Azure, Filen providers (v1.4.1)
pbkdf2 = "0.12"
num-bigint-dig = "0.8"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"

# SFTP Support (Sprint 3 - v1.3.0)
# SFTP channel writes: see sftp-upload-0byte-bug.md in memory
russh = { version = "0.61.2", features = ["ring"] }
russh-sftp = "2.1"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }

# Archive Support with Encryption (v1.3.0+)
sevenz-rust = { version = "0.6", features = ["aes256", "compress"] }  # 7z with AES-256
unrar = "0.5"                                                          # RAR extraction
trash = "5"                                                            # Cross-platform trash/recycle bin
tar = "0.4.46"                                                        # TAR archives (CVE symlink chmod + PAX size fix)
flate2 = "1.0"                                                        # Gzip compression
xz2 = { version = "0.1", features = ["static"] }                       # XZ/LZMA compression (static: no system liblzma needed)
bzip2 = "0.6"                                                         # Bzip2 compression
arboard = "3"                                                         # Native clipboard access
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }  # Image editing + tray badge
libc = "0.2"                                                              # Unix UID for badge socket path

# Cryptomator vault support (v1.6.0)
scrypt = "0.11"                                                        # Cryptomator KDF
aes-kw = "0.2"                                                         # AES Key Wrap (RFC 3394)
aes-siv = "0.7"                                                        # AES-SIV filename encryption
data-encoding = "2"                                                    # Base32/Base64 encoding
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs", "hmac", "use_pem"] } # JWT HS256 + GitHub App RS256 without RustCrypto rsa (feature is aws_lc_rs with underscores; the hyphen form only enabled the optional dep, leaving the crypto provider uninstalled and JWT signing/verification panicking)

# AeroVault v2 - Military-Grade Encryption (v1.8.0)
aerovault = "0.4.2"                                                    # AeroVault v2/v3 standalone crate (crates.io, CRYPTO-01 + dual-audit AV-001/006/011/012)
aes-gcm-siv = "0.11"                                                   # AeroVault v3 AEAD content encryption
chacha20poly1305 = "0.10"                                              # ChaCha20-Poly1305 (used by CryptoLab in cyber_tools)
hkdf = "0.12"                                                          # HKDF key derivation (used by crypto.rs keystore)

# Security Toolkit - Cyber Tools (v2.1.0)
blake3 = "1"                                                           # BLAKE3 hash (Hash Forge)
similar = "3"                                                          # Unified diff for local_diff tool

# TOTP 2FA for AeroVault (v2.3.0)
totp-rs = { version = "5", features = ["qr"] }                        # RFC 6238 TOTP with otpauth URI

# Chat History SQLite (v2.3.0)
rusqlite = { version = "0.32", features = ["bundled"] }                # SQLite with FTS5 (bundled = no system libsqlite3)

# CLI Foundation (v2.3.0)
clap = { version = "4", features = ["derive", "env"] }                  # CLI argument parser
clap_complete = "4"                                                    # Shell completion generation
indicatif = "0.18"                                                     # Progress bars for CLI
rpassword = "7"                                                        # Secure password input (no echo)
ctrlc = "3"                                                            # Graceful Ctrl+C with cleanup
globset = "0.4"                                                        # Glob patterns for batch transfers
tempfile = "3"                                                        # Temporary files for stdin upload/resume workflows
libunftp = "0.23"                                                      # FTP server framework (serve ftp)
unftp-core = "0.1"                                                     # FTP server storage/auth traits

# Interactive TUI (ncdu disk explorer)
ratatui = "0.30"                                                       # Terminal UI framework
crossterm = "0.29"                                                     # Cross-platform terminal control

# zstd compression. Used by two independent code paths:
#   1. Keystore export v2 (`keystore_export.rs`) -- compresses the
#      serialised payload before AES-GCM. Critical for full backups:
#      the inner SQLite dumps and plugin/snapshot file tree compress
#      3-6x, dropping a multi-tens-of-MB file back to single-digit MB.
#      Promoted from optional to default in v3.7.8 so the file format
#      can rely on zstd being always available (the `compression`
#      envelope field never has to fall back at decode time).
#   2. aerorsync `real_wire.rs` -- decompresses DEFLATED_DATA literals
#      emitted by rsync's sender when CPRES_ZSTD is negotiated.
zstd = "0.13"

# P2-01: Reed-Solomon erasure coding for AeroVault v4 ECC layer (T-AEROVAULT-ECC).
# Crate: reed-solomon-erasure (pure-Rust GF(2^8) implementation).
# - Block-level parity over ciphertext chunks (the exact bytes protected by existing cipher_hash).
# - Chosen for: maturity, no C FFI, configurable shard counts, good perf on the sizes we use (256KiB–16MiB chunks).
# - Audit note / D-02 justification: see docs/security-evidence/REED-SOLOMON-ERASURE-EVALUATION-2026-06.md.
# - Kept out of default features until the ECC path is exercised and reviewed.
# - Exact-pinned (like russh/tauri) because it is crypto-adjacent: blocks unreviewed
#   minor bumps. Already the resolved version in Cargo.lock; revisit on audit review.
reed-solomon-erasure = "=6.0.0"
# aerorsync: XXH3-128 file-level checksum trailer (S8j). Provides
# `xxhash_rust::xxh3::xxh3_128` used by the driver to compute the file
# checksum rsync verifies at the end of a delta stream.
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }

# Local speech-to-text: excluded on macOS (WKWebView has native Web Speech API)
# and gated behind the `local-stt` feature on Linux/Windows. The feature is
# default-on, so production builds keep whisper-rs + hound exactly as before;
# a `--no-default-features --features aerorsync` build (used by the dispatcher
# matrix on Windows runners with a VS minor version that whisper-rs-sys's
# build chain mismatches against) drops the speech stack entirely and stubs
# the module, avoiding the MSVC `__imp_*` link failures while leaving the
# default release path untouched.
[target.'cfg(not(target_os = "macos"))'.dependencies]
hound = { version = "3", optional = true }
whisper-rs = { version = "0.16.0", optional = true }

# Windows Explorer badge integration (v2.0.5)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Storage_CloudFilters",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Shell",
    # SetConsoleCtrlHandler: MCP/orchestrate stdio daemon must swallow
    # console Ctrl+C / Ctrl+Break broadcasts (self-updater, parent shell)
    # instead of dying. See install_mcp_signal_guard in aeroftp_cli.rs.
    "Win32_System_Console",
] }
# Windows Registry access for auto-update install-format detection.
# Walks HKLM/HKCU `Software\Microsoft\Windows\CurrentVersion\Uninstall`
# to distinguish MSI from NSIS installs deterministically. Pinned for
# reproducibility; version 0.55 supports the Win10/11 RegistryView APIs.
winreg = "0.56"

# Linux-only dependencies
# - tauri-plugin-localhost: WebKitGTK workaround (Monaco ESM, xterm.js, canvas, iframe CSS)
# - fuser: FUSE virtual filesystem mount (macOS requires macFUSE installed by user)
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-localhost = "2"
# T-DEBT-13c: bumped from 0.16 to 0.17. Breaking changes consumed in
# `mod fuse_mount` (cli.rs): all `Filesystem` trait methods migrated
# from `&mut self` to `&self`, integer args switched to newtypes
# (`INodeNo`, `FileHandle`, `OpenFlags`, `WriteFlags`, `RenameFlags`,
# `BsdFileFlags`, `LockOwner`), `spawn_mount2` now takes a `Config`
# instead of `&[MountOption]`. The `abi-7-*` cargo features are
# ignored by 0.17 in favour of runtime kernel-capability probes, so
# the previous `abi-7-31` opt-in is dropped; `FUSE_WRITEBACK_CACHE`
# now lives in `InitFlags::FUSE_WRITEBACK_CACHE` and is always
# compiled in.
fuser = "0.17"
# gtk: needed only to pin a stable GTK program name at startup via
# `gtk::glib::set_prgname` so the X11/Wayland WM_CLASS is always
# "aeroftp" regardless of how the binary is launched. This makes the
# window match `StartupWMClass=aeroftp` in AeroFTP.desktop even when the
# updater relaunches `current_exe()` (= /usr/lib/aeroftp/aeroftp.bin),
# fixing the generic-icon-after-update bug. Already present transitively
# via tauri/wry, so this adds no real build cost.
gtk = "0.18"

[dev-dependencies]

[features]
default = ["aerorsync", "local-stt"]
custom-protocol = ["tauri/custom-protocol"]

# aerorsync: AeroFTP's native Rust implementation of the rsync wire
# protocol 31 (in-tree since PR-T11, default-on). Turns on the
# cross-platform Rust implementation under `src/aerorsync/`, enabling
# byte-level delta sync on Windows (first-class) and as the preferred
# path on Unix when `settings::load_native_rsync_enabled()` returns
# true. The `native_rsync_enabled` runtime toggle and its TOML config
# file retain the legacy name for backward compatibility.
# Disable with `--no-default-features` for leaner builds or when
# debugging the classic binary-rsync path on Unix.
aerorsync = ["dep:xxhash-rust"]

# local-stt: local speech-to-text via whisper.cpp. Pulls in `whisper-rs`
# (whisper.cpp Rust bindings) and `hound` (WAV decode). Default-on so
# production GUI builds keep the AeroAgent voice-input pipeline intact.
# Turn off with `--no-default-features --features aerorsync` for builds
# that only need the dispatcher / CLI / aerorsync path: this skips the
# whisper-rs-sys C/C++ stack entirely, which is the workaround for the
# MSVC link drift seen on Windows runners whose VS Build Tools minor
# version mismatches the CI image (e.g. local 17.14 vs cached 17.x). On
# macOS the speech stack already lives behind `cfg(target_os = "macos")`
# stubs (Web Speech API used instead), so this feature is a no-op there.
local-stt = ["dep:hound", "dep:whisper-rs"]

# Strada C: Docker-harness lane cfg flags. Declared here so
# `#[cfg(ci_lane2)]` / `#[cfg(ci_lane3)]` do not surface
# `unexpected_cfgs` warnings under `-D warnings`. Enable on CI with
# `RUSTFLAGS='--cfg ci_lane3'` (or `ci_lane2`); left unset otherwise.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ci_lane2)',
    'cfg(ci_lane3)',
] }
